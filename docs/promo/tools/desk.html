<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<!-- docs/promo: a desktop - blurred wallpaper, a browser window with the web app in it -
     for the screens in the promo images. Served by serve.mjs at /promo/tools/desk.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk</title>
<style>
  :root { --frame: #1f1f1f; --tab: #3b3b3b; --omni: #282828; --text: #e3e3e3; --dim: #8e918f; --icon: #c4c7c5; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2230; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .wall { position: absolute; inset: -90px; background-size: cover; background-position: center; filter: blur(40px) saturate(1.1) brightness(.8); }
  .win { position: absolute; border-radius: 12px; overflow: hidden; background: var(--tab);
         box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 .5px rgba(255,255,255,.16), 0 26px 60px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.3); }
  .tabs { position: relative; height: 40px; background: var(--frame); display: flex; align-items: flex-end; padding-left: 86px; }
  .lights { position: absolute; left: 16px; top: 14px; display: flex; gap: 8px; }
  .lights i { display: block; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.28); }
  .tab { position: relative; width: 236px; height: 33px; box-sizing: border-box; background: var(--tab); border-radius: 10px 10px 0 0;
         display: flex; align-items: center; gap: 9px; padding: 0 9px 2px 13px; color: var(--text); font-size: 12px; letter-spacing: .1px; }
  .tab::before, .tab::after { content: ""; position: absolute; bottom: 0; width: 10px; height: 10px; }
  .tab::before { left: -10px; background: radial-gradient(circle at 0 0, transparent 9.5px, var(--tab) 10px); }
  .tab::after { right: -10px; background: radial-gradient(circle at 100% 0, transparent 9.5px, var(--tab) 10px); }
  .tab img { width: 16px; height: 16px; }
  .tab .t { flex: 1; white-space: nowrap; overflow: hidden; }
  .newtab { margin: 0 0 4px 16px; color: var(--icon); display: grid; place-items: center; width: 28px; height: 28px; }
  .bar { height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 10px; }
  .btn { width: 32px; height: 32px; display: grid; place-items: center; color: var(--icon); }
  .btn.off { color: #6d706f; }
  .omni { flex: 1; height: 34px; margin: 0 6px; border-radius: 17px; background: var(--omni); display: flex; align-items: center; gap: 10px; padding: 0 12px 0 5px; color: var(--text); font-size: 14px; }
  .omni .site { width: 26px; height: 26px; border-radius: 50%; background: #3b3b3b; display: grid; place-items: center; color: var(--icon); }
  .omni .host { flex: 1; letter-spacing: .1px; }
  .omni .star { color: var(--icon); display: grid; }
  .me { width: 24px; height: 24px; border-radius: 50%; background: #5b7c99; color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; margin: 0 4px 0 2px; }
  iframe { position: absolute; left: 0; top: 84px; width: 100%; height: calc(100% - 84px); border: 0; background: #262626; }
</style>
</head>
<body>
<div class="wall" id="wall"></div>
<div class="win" id="win">
  <div class="tabs">
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="tab"><img src="/favicon-32x32.png" alt=""><span class="t">Off The Cloud</span>
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="#c4c7c5" stroke-width="1.4" stroke-linecap="round"/></svg></div>
    <div class="newtab"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
  </div>
  <div class="bar">
    <div class="btn"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M15 9H3.5M8.5 3.8 3.3 9l5.2 5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="btn off"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9h11.5M9.5 3.8 14.7 9l-5.2 5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="btn"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M14.6 9a5.6 5.6 0 1 1-1.7-4M13.2 2.6v2.9h-2.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="omni">
      <span class="site"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2.5 5h7M12.5 5h1M2.5 11h1M6.5 11h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="11" cy="5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="5" cy="11" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span>
      <span class="host" id="host">pit.off-the.cloud</span>
      <span class="star"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2.6l1.9 4 4.3.5-3.2 2.9.9 4.3L9 12.1l-3.9 2.2.9-4.3-3.2-2.9 4.3-.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span>
    </div>
    <div class="btn"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M7 3.2h2.6v1.4a1.3 1.3 0 0 0 2.6 0V3.2h2.6v3.1h-1.2a1.3 1.3 0 0 0 0 2.6h1.2v5.9H3.2V9.4h1.4a1.3 1.3 0 0 0 0-2.6H3.2V3.2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
    <div class="me">H</div>
    <div class="btn"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="4" r="1.4" fill="currentColor"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="14" r="1.4" fill="currentColor"/></svg></div>
  </div>
  <iframe id="app" title="Off The Cloud"></iframe>
</div>
<script>
  // ?m= side margin, mt/mb top/bottom margin (CSS px), wall= sample photo used
  // (blurred) as the desktop wallpaper, host= the address shown, q= passed to the app.
  const q = new URLSearchParams(location.search);
  const m = +(q.get("m") ?? 34), mt = +(q.get("mt") ?? 30), mb = +(q.get("mb") ?? 30);
  Object.assign(document.getElementById("win").style, { left: m + "px", right: m + "px", top: mt + "px", bottom: mb + "px" });
  document.getElementById("wall").style.backgroundImage = `url(/promo/source/library/${q.get("wall") ?? "04"}.jpg)`;
  if (q.get("host")) document.getElementById("host").textContent = q.get("host");
  document.getElementById("app").src = "/" + (q.get("q") ? "?" + q.get("q") : "");
</script>
</body>
</html>
