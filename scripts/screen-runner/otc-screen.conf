# Off The Cloud on a connected screen: where the device keeps the screen's
# key (session/screenkey.go), which keeps the screen signed in through the
# service restarting. In /run, so in memory only: a device switched off
# keeps nothing of it. The otc service's alone; made again at every boot.
d /run/otc-screen-key 0700 otc otc -
