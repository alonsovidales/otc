    ReqGetNotificationCount req_get_notification_count = 71;
    ReqMarkNotificationsAcknowledged req_mark_notifications_acknowledged = 72;
    ReqGetPublication req_get_publication = 73;
    // Issue #82: multiple users on one device.
    ReqListUsers req_list_users = 74;
    ReqCreateUser req_create_user = 75;
    ReqDeleteUser req_delete_user = 76;
    // 77 was ReqSetUserAdmin (issue #82) - removed by issue #89, left
