syntax = "proto3";

import "google/protobuf/timestamp.proto";

package msg;

option go_package = "github.com/alonsovidales/otc/proto/generated;msg";
// Android app (issue #88): protoc --java_out/--kotlin_out. Java-only
// options, ignored by the Go/TS/Swift generators.
option java_package = "cloud.offthe.otc.proto";
option java_multiple_files = true;
option java_outer_classname = "MessagesProto";

enum StatusErrorCode {
  DiskError = 0;
  Syncing = 1;
  MissingDisk = 2;
  ErrorInDisk = 3;
}

message StatusErrors {
  StatusErrorCode StatusErrorCode = 1;
  string Message = 2;
}

message GetStatus {
}

// Issue #65: RAID health as its own explicit state, not something the
// client has to infer from errors being present/absent. NoRaid covers a
// device with no md array at all (e.g. a single-disk test box) as distinct
// from Unknown (an array exists but /proc/mdstat couldn't be parsed) —
// both render as "no bar to draw", but they're different enough
// conditions to keep separate rather than collapsing to one "n/a" value.
enum RaidState {
  RaidUnknown = 0;
  RaidNone = 1;
  RaidInSync = 2;
  RaidSyncing = 3;
  RaidDegraded = 4;
}

message Status {
  bool online = 1;
  reserved 2; // was local_ip - issue #65: a device's IP has no place in
              // its own status readout, and nothing ever actually
              // populated this field to begin with.
  reserved "local_ip";
  int32  disks = 3; // total physical devices in the RAID array (0 if none)
  repeated StatusErrors  errors = 4;
  int32  raid_size = 5;
  int32  raid_usage = 6;
  int32  disk_size = 7;
  int32  disk_usage = 8;
  float  cpu_usage_prc = 9;
  int32  mem_size = 10;
  int32  mem_usage = 11;
  // Issue #65: parsed from /proc/mdstat - see status.readRaidStatus.
  RaidState raid_state = 12;
  string raid_level = 13;           // e.g. "raid1", "raid5"; "" if no array
  int32 raid_devices_active = 14;   // active/in-sync devices, out of `disks`
  float raid_sync_percent = 15;     // only meaningful when raid_state == Syncing
}

message Auth {
  string uuid = 1;
  // RSA-OAEP(SHA-256) ciphertext of the password, encrypted by the client
  // using the public key returned by GetPubKey/PubKey for this connection.
  bytes key = 2;
  bool create = 3;
}

// Issue #101: a browser has no Keychain/vault of its own to replay a real
// password from on reload the way the native apps do, so it used to keep
// the actual account password sitting in plain localStorage instead (see
// web/src/net/pwCrypto.ts) - anything that could read that origin's
// storage got the real password, not just a way back into one session.
// IssueSessionToken mints a random opaque token for the connection's
// *already established* session (so this is authenticated-only, unlike
// Auth itself) that AuthWithToken can redeem on some later connection in
// place of the password - see session/tokens.go for the server-side
// store, and its own doc comment for why every redemption mints a fresh
// token rather than counting down from the original login.
message ReqIssueSessionToken {
}

message SessionToken {
  string token = 1;
  int64 expires_at_unix_ms = 2;
}

message RespSessionToken {
  SessionToken session_token = 1;
}

// Pre-auth, like Auth itself - answers with the same generic Ack shape
// Auth does (Ok, or ErrorMsg on an expired/unknown/already-redeemed
// token). A client that gets Ok back still needs its own follow-up
// IssueSessionToken call to keep a fresh token in storage, since redeeming
// one consumes it (see RedeemToken).
message ReqAuthWithToken {
  string token = 1;
}

// Issue #103: asked by a device before it provisions an additional user,
// so a subdomain that is already spoken for is caught up front instead of
// becoming an unreachable account. Answers with RespDomainAvailable.
//
// Authenticated as an existing registered device (owner_uuid/domain/secret
// - the asking device's own, verified the same way ReqSetDeviceDisabled
// and ReqRotateBridgeSecret verify theirs) rather than being open to
// anyone. Without that this would be an anonymous "does <name> exist?"
// oracle on a public relay, letting anybody enumerate which subdomains -
// and therefore which people - are registered here.
message ReqIsDomainAvailable {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  // The subdomain being considered, e.g. "pepe.off-the.cloud".
  string candidate_domain = 4;
}

message RespDomainAvailable {
  bool available = 1;
}

// Sent when the owner explicitly signs out (see SettingsForm's Sign Out
// button) so a token that's already sitting in some other tab's storage
// stops working immediately, rather than just quietly expiring on its own
// TTL. Answers with the generic Ack.
message ReqRevokeSessionToken {
}

// GetPubKey requests the ephemeral RSA public key generated for this
// WebSocket connection. Clients must call this before sending Auth or
// ChangeKey, and use it to encrypt the key material client-side so that
// the plaintext password never crosses the bridge, which only relays
// already-encrypted application payloads between device and client.
message GetPubKey {
}

message PubKey {
  // PKIX/SPKI DER-encoded RSA public key, valid only for this connection.
  bytes public_key = 1;
  // True when this device has no owner secret set up yet (issue #39) —
  // every client already calls GetPubKey before Auth, so this is the
  // cheapest place to tell a fresh device apart from a normal login
  // without a dedicated round trip. Clients should show a first-run setup
  // flow (device password + owner name) instead of a plain sign-in form.
  bool is_new_device = 2;
  // Issue #85: false on an additional user's own instance (issue #82's
  // per-user child process), true on the device's primary one. Rides
  // along here for the same reason is_new_device does - the first-run
  // wizard has to decide what to show *before* anyone is authenticated,
  // so it can't use the authenticated ReqGetInstanceRole the Settings
  // screen uses for the same question. What it decides: a child instance
  // is asked only for an owner name and password, never the storage or
  // WiFi steps, because those configure the shared physical machine and
  // belong solely to the primary (which is also enforced server-side -
  // see the guards on ReqSetupStorage/ReqSetWifi).
  bool is_primary = 3;
}

message UploadFile {
  string path = 1;
  bytes content = 2;
  bool forceOverride = 3;
  google.protobuf.Timestamp created = 4;
  // The photo library's own identifier for the asset this came from (iOS:
  // PHCloudIdentifier, the same on every device signed into the owner's
  // iCloud account; Android has nothing comparable, its MediaStore ids are
  // one phone's row numbers). The device keeps it next to the content hash
  // so another phone, or this one after a reinstall, can recognise the
  // asset with HasCloudIds instead of downloading it from iCloud to hash it.
  string cloud_id = 5;
}

// Issue #58: lets a sync client (iOS/macOS) check whether this device
// already has a file with this content before sending it - storage is
// already deduplicated by hash server-side (multiple paths can share one
// on-disk blob), this just lets a client find that out *before* spending
// the bandwidth on a re-upload, not just after.
message HasFile {
  string hash = 1;
  // Optional: the asset's cloud id (see UploadFile.cloud_id). When the hash
  // is on the device, it is attached to every row with that hash - this is
  // how content that was uploaded before cloud ids existed, or from another
  // platform, gets one.
  string cloud_id = 2;
}

// HasCloudIds: which of these cloud ids (UploadFile.cloud_id) does the
// device already hold, and under which content hash - the answer that lets
// a photo sync skip the iCloud download and just LinkFile the hash.
message HasCloudIds {
  repeated string cloud_ids = 1;
}

message CloudIdFile {
  string cloud_id = 1;
  string hash = 2;
}

message CloudIdsFound {
  repeated CloudIdFile files = 1;
}

message FileExists {
  bool exists = 1;
}

// LinkFile registers `path` as pointing at content this device already
// has (hash), without transferring it again - the client is expected to
// have confirmed via HasFile first that the hash actually exists here;
// the server verifies that itself too and rejects the request if not,
// rather than trusting the claim blindly.
message LinkFile {
  string hash = 1;
  string path = 2;
  bool forceOverride = 3;
  google.protobuf.Timestamp created = 4;
  // See UploadFile.cloud_id.
  string cloud_id = 5;
}

message DelFile {
  string path = 1;
}

message GetFile {
  string path = 1;
  // Issue #132: an older version's hash (from ListFileVersions) serves that
  // version's content instead of the current one.
  string hash = 2;
}

// Issue #132: mark a folder upload only (or clear it). Nothing under an
// upload-only folder can be deleted, and a second upload to a path that
// already exists keeps the old content as a version instead of replacing
// or refusing it.
message SetUploadOnly {
  string path = 1;
  bool upload_only = 2;
}

// Issue #132: the older versions of a path in an upload-only folder, newest
// first. Each entry's `modified` is when it stopped being the current one;
// its hash is what GetFile.hash takes.
message ListFileVersions {
  string path = 1;
}

message FileVersions {
  repeated File versions = 1;
}

message ListFiles {
  string path = 1;
  bool recursive = 2;
}

message SearchPhotos {
  repeated string tags = 1;
  string token = 2;
  // include_videos (issue #60): the Photo Gallery's own search stays
  // images-only (its default, unset value), but the social composer wants
  // to offer videos alongside photos too - both share this one RPC, so a
  // caller opts in explicitly rather than the gallery silently gaining
  // videos it never asked for.
  bool include_videos = 3;
  // person_ids (issue #52 follow-up): filters to photos containing a face
  // matched to *every* person listed here (AND, not OR) - "person X with
  // dogs" means combining this with tags = ["dogs"] on the same request,
  // not two separate searches. Lives on the Photo Gallery's own search bar
  // now, not a separate People screen.
  repeated string person_ids = 4;
  // Issue #77: the date scrubber's "jump to date". When set, the server
  // always starts a *fresh* search filtered to created <= before and
  // hands back a new token (any existing token is ignored) - rather than
  // a real seekable SQL cursor, this piggybacks the existing token
  // mechanism (files_manager.ImageSearch already computes the whole
  // filtered/sorted result set once per token) by treating a jump exactly
  // like a brand new search.
  google.protobuf.Timestamp before = 5;
  // How many results the client already holds, sent so a search can be
  // resumed when the device no longer recognises the token.
  //
  // Tokens are an in-memory cache of the whole result set: they expire
  // after a few minutes of not scrolling, and a device restart drops all
  // of them. Without this the device can only start the search over and
  // hand back page one again - photos the client already has, which it
  // discards, so the grid appears to have run out partway down. With it,
  // a resumed search skips straight to where the client actually was.
  //
  // Only meaningful alongside a token (i.e. when resuming); a search
  // starting from scratch sends nothing and is never skipped forward.
  int32 have = 6;
  // Issue #115: restrict to one image group (album). A group is just
  // another filter on this same search - combined with tags/people
  // exactly like they combine with each other - which is what keeps
  // search and scrolling working unchanged inside a group.
  string group_id = 7;
}

message ListOfFiles {
  repeated File files = 1;
  string token = 2;
}

// Issue #77: per-month photo counts, used to size/position the gallery's
// date scrubber and to know how many placeholder squares to draw while
// dragging to a month that hasn't loaded yet. Same filter shape as
// SearchPhotos minus token/before - a scrubber query, not a page fetch.
message ReqPhotoDateBuckets {
  repeated string tags = 1;
  repeated string person_ids = 2;
  bool include_videos = 3;
  string group_id = 4; // issue #115, same meaning as SearchPhotos.group_id
}

message PhotoDateBucket {
  string month = 1; // "2022-06"
  int32 count = 2;
}

message RespPhotoDateBuckets {
  repeated PhotoDateBucket buckets = 1; // ordered desc, newest first
}

message File {
  string hash = 1;
  string mime = 2;
  google.protobuf.Timestamp created = 3;
  google.protobuf.Timestamp modified = 4;
  string path = 5;
  int32 size = 6;
  optional bytes content = 8;
  // Issue #132, filled by ListFiles: this entry is, or is inside, an
  // upload-only folder (see SetUploadOnly), and how many older versions
  // the file has (see ListFileVersions).
  bool upload_only = 9;
  int32 versions = 10;
}

message Ack {
  bool ok = 1;
  string error_msg = 2;
  // Issue #56: a stable, machine-readable tag for the cases a client has
  // to *react* to rather than just print - currently the two the bridge
  // itself answers with when it can't hand a request to a device at all:
  // "device_unreachable" (registered domain, no live connection - see
  // cDeviceUnreachableMsg) and "account_disabled" (issue #93). Empty for
  // every other Ack, which stays exactly as it was.
  //
  // error_msg remains the thing to show a person; this only exists so a
  // client can tell these apart without matching on English prose that
  // three codebases would then have to keep in step.
  string code = 3;
  // Issue #117: set with code "too_many_attempts" - how long, in seconds,
  // until this address may try a password again. Shown by every client,
  // so the message can say when rather than just no.
  int32 retry_after_seconds = 4;
}

message GetTags {
}

message TagsList {
  repeated string tags = 1;
}

message ChangeKey {
  // RSA-OAEP(SHA-256) ciphertext, see Auth.key.
  bytes old_key = 1;
  bytes new_key = 2;
}

// Issue #108: optionally trims one of the videos being published, cutting
// it down to [start_secs, end_secs) before it's compressed and posted.
// The original file in the owner's library is never touched - only the
// copy that goes into the post, exactly like the size-driven compression
// in issue #60.
message VideoTrim {
  // Matches one entry in NewSocialPublication.paths.
  string path = 1;
  double start_secs = 2;
  // Exclusive end. Zero (or anything <= start) means "to the end of the
  // clip", so a caller that only wants to cut an intro can send just a
  // start.
  double end_secs = 3;
}

message NewSocialPublication {
  string text = 1;
  repeated string paths = 2;
  // Issue #108: at most one entry per path, and only for videos. Paths
  // with no entry here are published whole, so this is purely additive -
  // a client that knows nothing about trimming behaves exactly as before.
  repeated VideoTrim trims = 3;
}

message GetEvents {
  google.protobuf.Timestamp since = 1;
  int32 total = 2;
}

message GetSocialPublicationFiles {
  string uuid = 1;
}

// Issue #107: fetches the *full* bytes of one file in a publication -
// GetSocialPublicationFiles above only ever returns thumbnails, which is
// right for rendering a feed but leaves no way to actually play a video
// in it.
//
// Addressed by hash rather than path because a publication's files simply
// have no path: social_publications_files stores (pos, uuid, hash, mime,
// size), and the bytes live in unenc-storage-path keyed by that hash. The
// clients were asking GetFile for an empty path, which could never work -
// so a video in the timeline has never played on any platform.
//
// pub_uuid is not redundant: the device only serves a hash that actually
// belongs to that publication, which keeps this from becoming a
// read-any-file-by-hash oracle for anyone who can reach the feed.
message GetPublicationMedia {
  string pub_uuid = 1;
  string hash = 2;
}

// Issue #110: streaming instead of downloading a whole video before it
// can start playing. The client asks for a URL it can hand straight to a
// <video> element or AVPlayer, which then fetch it with ordinary HTTP
// range requests - the player starts on the first chunk and only ever
// pulls the parts it actually plays.
message ReqGetMediaURL {
  // Exactly one of: a library path (the owner's own file), or a
  // publication's media, addressed the same way GetPublicationMedia does.
  string path = 1;
  string pub_uuid = 2;
  string hash = 3;
}

message RespMediaURL {
  // Empty when streaming this file wouldn't pay for itself - a small clip
  // arrives in one socket round trip, where streaming would cost an extra
  // one for this very call before a single byte moved. The client falls
  // back to fetching the whole thing, exactly as it did before.
  string url = 1;
  int64 total_size = 2;
  string mime = 3;
  int64 expires_at_unix_ms = 4;
}

// Issue #110: how the bridge serves a range of a device's media over the
// relay tunnel. Never called by a browser or app directly - they talk
// plain HTTP to /media/<token>, and the bridge translates. The token is
// the only credential: it was minted for one specific file, for one
// already-authenticated session, and expires (see mediatokens).
message ReqGetMediaRange {
  string token = 1;
  int64 offset = 2;
  int64 length = 3;
}

message RespMediaRange {
  bytes content = 1;
  int64 offset = 2;
  int64 total_size = 3;
  string mime = 4;
}

// Issue #94: updating the device in place from Settings.
message ReqCheckUpdate {}

message UpdateRelease {
  int32 version = 1;
  // Named "summary" rather than "description": SwiftProtobuf renames a
  // field called description to description_p, because it would collide
  // with CustomStringConvertible - and every client would then be reading
  // an oddly-named field for no reason.
  string summary = 2;
}

message RespUpdateInfo {
  int32 current_version = 1;
  int32 latest_version = 2;
  // The releases this device has yet to apply, oldest first - what makes
  // the update incremental rather than a reinstall.
  repeated UpdateRelease pending = 3;
  // "idle", "running", "done", "failed" or "uptodate", plus whatever the
  // runner last reported. Survives the restart an update performs, since
  // the runner writes it to disk rather than holding it in memory.
  string state = 4;
  string message = 5;
  string last_updated = 6;
  // Set when the manifest itself couldn't be reached, which is different
  // from "no updates": one means try again later, the other means there
  // is nothing to do.
  string check_error = 7;
}

// Starts the update and answers immediately - it takes minutes and ends
// by restarting this very process, so there is nothing to wait for. Poll
// ReqCheckUpdate for progress.
message ReqApplyUpdate {}

// Issue #80: reaching the device over Tailscale Funnel instead of the
// bridge. Offered at first setup; see the limitations spelled out there.
message ReqSetupTailscale {
  // Optional. With a pre-shared auth key the whole setup is
  // non-interactive; without one, Tailscale needs a human to authorise
  // the node and the answer carries the URL to do that on.
  string auth_key = 1;
  // False turns Funnel back off. The node stays in the tailnet - leaving
  // that is the owner's business, not something this switch should
  // decide for them.
  bool enable = 2;
}

message ReqGetTailscaleStatus {}

message RespTailscaleStatus {
  bool installed = 1;
  bool logged_in = 2;
  bool funnel_on = 3;
  // Where the device can be reached, once it can be.
  string public_url = 4;
  // Set when a human still has to authorise this node.
  string login_url = 5;
  string error = 6;
}

message GetSocialPublications {
  google.protobuf.Timestamp since = 1;
  int32 total = 2;
  repeated string exclude_uuids = 3;
}

message NewSocialComment {
  string pub_uuid = 1;
  string comment = 2;
  string publisher = 3;
}

message DelSocialComment {
  string comment_uuid = 1;
}

// issue #34: delete one of your own posts.
message DelSocialPublication {
  string pub_uuid = 1;
}

message DidSendFriendshipReq {
  string secret = 1;
  string domain = 2;
}

message Friendship {
  Profile origin_profile = 2;
  FriendShipStatus status = 3;
  bool sent = 4;
  string secret = 5;
  google.protobuf.Timestamp latest_sync = 6;
  // Issue #92: false until this friend's entire backlog of pre-existing
  // events has been fully replayed at least once (see social.go's
  // updateFriendEvents) - accepting a long-time-active friend otherwise
  // floods the owner with a notification for every historical like/
  // comment/post all at once. Real-time events from this point on notify
  // normally; the one-time backlog catch-up never does.
  bool notifications_started = 7;
}

message Friendships {
  repeated Friendship friendships = 1;
}

message FriendshipsList {
}

message FriendshipRequest {
  string domain = 1;
}

message FriendshipInterRequest {
  string domain = 1;
  string secret = 2;
  Profile origin_profile = 3;
}

enum FriendShipStatus {
  Pending = 0;
  Accepted = 1;
  Blocked = 2;
}

message ChangeFriendStatus {
  string domain = 1;
  FriendShipStatus status = 2;
}

// Issue #25: the owner removes a friend request from their own device -
// one they sent (withdrawing it) or one they received (declining it).
// The device also asks the other side to drop its copy, best effort.
message DeleteFriendship {
  string domain = 1;
}

// Issue #25: device-to-device counterpart of DeleteFriendship, sent by the
// deleting device so the other one drops its copy of the request too.
// Authenticated the way GetFriendshipStatus and DidSendFriendshipReq are:
// by the per-friendship secret only the two devices share.
message FriendshipInterDelete {
  string domain = 1; // the calling device's own domain
  string secret = 2;
}

message LikePublication {
  string pub_uuid = 1;
}

message LikeComment {
  string comment_uuid = 1;
}

// issue #29: "who liked this" for a publication or a comment.
message GetPublicationLikers {
  string pub_uuid = 1;
}

message GetCommentLikers {
  string comment_uuid = 1;
}

message Likers {
  repeated Profile likers = 1;
}

enum ActionType {
  FriendshipReq = 0;
  LikePub = 1;
  LikeComm = 2;
  NewSocialComm = 3;
}

message GetSettings {
}

message SetSettings {
  string domain = 1;
}

message Settings {
  string domain = 1;
  // bridge_secret is the shared secret this device registers with the
  // bridge relay (see BridgeRegister below) — exposed so the setup section
  // can show/update it (issue #40) instead of it only ever being set
  // implicitly at first boot.
  string bridge_secret = 2;
  // face_recognition_enabled (issue #52) - off by default. Toggled via
  // SetFaceRecognitionEnabled below, not SetSettings: same reasoning as
  // SetBridgeSecret being its own request rather than a field bundled onto
  // SetSettings (see its own doc comment).
  bool face_recognition_enabled = 3;
}

// SetFaceRecognitionEnabled (issue #52) is deliberately its own request,
// not a field on SetSettings - see Settings.face_recognition_enabled's doc
// comment. A photo uploaded while this is off is never processed for faces
// even after this is turned back on - see the `faces` table's own doc
// comment in db.sql for why that's a deliberate design choice, not a
// missing backfill feature.
message SetFaceRecognitionEnabled {
  bool enabled = 1;
}

// Person is one named (or not-yet-named) individual recognized across the
// library (issue #52). cover_thumbnail is one representative face crop (an
// aligned, already-small JPEG - see face_recognition.FaceDetection), enough
// to render a People list without a second round trip per entry.
message Person {
  string id = 1;
  string name = 2;
  int32 face_count = 3;
  bytes cover_thumbnail = 4;
}

message ListPeople {
}

message People {
  repeated Person people = 1;
}

// RenamePerson also *creates* the name for a still-unnamed (name == "")
// person - there's no separate "add a name" request, since from the
// server's point of view naming an unnamed person and renaming an already-
// named one are the exact same update.
message RenamePerson {
  string id = 1;
  string name = 2;
}

// DeletePerson removes this person and every face detection that was
// matched to them (issue #52: "just click on delete the individual") - see
// the `faces` table's own doc comment in db.sql. Not reversible: a face
// that reappears in a *future* photo gets clustered into a brand new
// person, same as if it had never been seen before.
message DeletePerson {
  string id = 1;
}

// MergePeople folds every source_ids person into target_id (issue #74) -
// for when the same individual got clustered into more than one Person
// (different angle/lighting missed face_recognition's same-person
// threshold). Every face detection belonging to a source person is
// reassigned to target_id and the source person rows are removed; target_
// id's own name/id are untouched, so pick whichever of the merged people
// already has the right name as the target. Not reversible - see
// DeletePerson's own doc comment on why an un-merge isn't a thing either
// (a future photo of that source identity just gets clustered fresh).
message MergePeople {
  string target_id = 1;
  repeated string source_ids = 2;
}

// Issue #115: image groups (albums). cover_thumbnail is one member's
// thumbnail, chosen at random per listing, so the list can render with
// a picture per group without a round trip each - same idea as
// Person.cover_thumbnail.
message ImageGroup {
  string id = 1;
  string name = 2;
  int32 file_count = 3;
  bytes cover_thumbnail = 4;
}

message ListImageGroups {
}

message ImageGroups {
  repeated ImageGroup groups = 1;
}

// CreateImageGroup makes a group holding `paths` (which may be empty).
// Paths rather than hashes because that is what a selection holds on
// every client; the device resolves them. Answered with the new group.
message CreateImageGroup {
  string name = 1;
  repeated string paths = 2;
}

message RespImageGroup {
  ImageGroup group = 1;
}

// AddToImageGroup adds `paths` to an existing group; already-members are
// ignored, not an error. Answered with the generic Ack.
message AddToImageGroup {
  string group_id = 1;
  repeated string paths = 2;
}

message RenameImageGroup {
  string id = 1;
  string name = 2;
}

// DeleteImageGroup removes the group and its membership rows only - never
// the pictures themselves. Answered with the generic Ack.
message DeleteImageGroup {
  string id = 1;
}

// StartReprocess kicks off issue #73's full-library reprocess: every
// image/video already uploaded gets its tags and faces recalculated from
// scratch (existing file_tags/faces/people are wiped first - see
// dao.WipeTagsAndFaces), run in the background using this connection's
// already-authenticated session. Answered with the generic Ack the moment
// the run starts (or resumes/no-ops - see files_manager.Reprocess), not
// when it finishes; poll GetReprocessStatus for progress. Calling this
// again while a run is already active in this process is a no-op, not an
// error - it just leaves the existing run going.
message StartReprocess {
  // Normally a previously stopped/interrupted run (status "running" or
  // "stopped") resumes from where it left off. force_restart says "no,
  // wipe everything and start over from the beginning anyway" - the
  // owner explicitly choosing a fresh run instead of continuing one
  // that's already partway done. Ignored while a run is actively active
  // in this process (cancel it first - see StopReprocess).
  bool force_restart = 1;
}

// GetReprocessStatus is polled (same pattern as GetStatus for RAID/disk)
// to drive the Settings screen's progress bar while a reprocess run is
// active - see ReprocessStatus.
message GetReprocessStatus {
}

message ReprocessStatus {
  // "idle" (never run), "running", "stopped" (cancelled - see
  // StopReprocess), "completed", or "failed".
  string status = 1;
  int32 total = 2;
  int32 processed = 3;
}

// StopReprocess cancels the active run, if any - a no-op otherwise.
// Answered with the generic Ack once the cancellation has been requested,
// not once the worker has actually wound down (it notices between files,
// see files_manager.CancelReprocess) - poll GetReprocessStatus to see
// status flip to "stopped". Stopping is not the same as it never having
// run: the next StartReprocess resumes from wherever this left off,
// exactly like recovering from an interrupted run.
message StopReprocess {
}

// SetBridgeSecret is deliberately its own request rather than a field on
// SetSettings: domain and bridge_secret used to be updated together (the
// secret was silently regenerated on every domain change), which broke a
// device's bridge pairing any time someone just wanted to rename their
// domain. They're independent settings now.
message SetBridgeSecret {
  string secret = 1;
}

// Issue #39/#38: first-run storage setup. Listing is safe/read-only (just
// /sys/block enumeration), but actually building the array is destructive
// (formats whichever disks are picked), so it's kept as an explicit,
// separate confirmation step rather than something that happens
// automatically just because a device was detected.
message ListStorageDevices {
}

message StorageDevice {
  // e.g. "/dev/sda" — this exact string is what SetupStorage expects back.
  string path = 1;
  int64 size_bytes = 2;
  string model = 3;
}

message StorageDevices {
  // Only devices safe to repurpose: the boot disk itself (and its
  // partitions), loop/ram devices, and anything with no usable size are
  // already filtered out server-side.
  repeated StorageDevice devices = 1;
}

// SetupStorage is destructive on anything selected: 2 devices creates a
// RAID1 mirror across them, 1 formats and uses that single device alone
// (no redundancy), 0 leaves storage on the boot disk as-is.
message SetupStorage {
  repeated string device_paths = 1;
}

// Issue #38: first-boot WiFi join, for a device reached over its own
// temporary "Off The Cloud" access point rather than an already-working
// network. Scanning is read-only (nmcli dev wifi list needs no special
// privilege), so it runs directly in the otc service like
// ListStorageDevices; actually joining a network is privileged the same
// way storage setup is — see SetWifi.
message ListWifiNetworks {
}

message WifiNetwork {
  string ssid = 1;
  // 0-100, from nmcli's SIGNAL column.
  int32 signal = 2;
  bool secured = 3;
}

message WifiNetworks {
  repeated WifiNetwork networks = 1;
}

// SetWifi hands the join off to a privileged process the same way
// SetupStorage does (see storage.RequestSetup) — the otc service can't run
// `nmcli connection up` itself. An empty password means an open network.
message SetWifi {
  string ssid = 1;
  string password = 2;
}

// Issue #43: push notifications when a friend posts. RegisterWebPush carries
// a browser PushSubscription's fields verbatim (endpoint + the two keys from
// subscription.toJSON().keys) so the device can send RFC8291-encrypted Web
// Push messages directly, no third-party push provider account needed.
message RegisterWebPush {
  string endpoint = 1;
  string p256dh = 2;
  string auth = 3;
}

// RegisterApnsToken registers this device's APNs token for real push
// delivery on iOS. Sending actually reaching the phone additionally needs
// this OTC device configured with an APNs Auth Key (see the [apns] config
// section) - registering the token here is safe/inert without one.
message RegisterApnsToken {
  string token = 1;
}

// Issue #131: the reverse of the two registrations above, sent best effort
// by Log Out (iOS) and Sign Out (web) before the phone or browser forgets
// the device, so the device - and through it the bridge - stops pushing to
// a client that is no longer signed in to it. Answers with the generic Ack;
// unregistering something the device never had is not an error.
message UnregisterApnsToken {
  string token = 1;
}

message UnregisterWebPush {
  string endpoint = 1;
}

message GetVapidPublicKey {
}

// The device generates its own VAPID keypair on first use (see push.Init) -
// no external account needed, unlike APNs. This is the public half, base64url
// encoded, ready to pass as PushManager.subscribe's applicationServerKey.
message VapidPublicKey {
  string key = 1;
}

message BridgeRegister {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
}

enum BridgeOnboardErrorType {
  generic_error = 0;
  taken_domain = 1;
  secret_missmatch = 2;
  unknown_owner = 3;
  pending_approval = 4;
}

message BridgeAckOnboard {
  bool ok = 1;
}

// BridgeClientInfo (issue #117) is the first thing the bridge sends down a
// relay connection once it has paired it with a client: the client's own
// address, which the device otherwise never sees - every relayed request
// arrives from the bridge's IP. The device keeps it for the life of that
// relay (one relay serves one client for its whole session) and rate-limits
// password attempts by it. Only honoured on connections the device itself
// dialled out to the bridge; a client connected directly to the device
// cannot send this to choose its own address.
message BridgeClientInfo {
  string remote_addr = 1;
}

// RotateBridgeSecret lets a device that already knows its current secret
// get a fresh one issued, without an admin manually deleting and re-adding
// its domain on the bridge's admin panel. Sent bridge-side (not on the
// device's own client-facing /ws) — `secret` is the CURRENT secret, and is
// the only thing that authenticates this request: the bridge only replaces
// it if this matches what it already has on record for owner_uuid+domain,
// same compare-and-swap spirit as BridgeRegister's existing secret check.
message RotateBridgeSecret {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
}

message RotateBridgeSecretAck {
  string new_secret = 1;
}

// Issue #93: sent by the primary instance to the bridge whenever it
// disables/re-enables one of its own additional users (issue #90) - that
// user's own process is actually stopped when disabled, so nothing on the
// device itself is left running to explain why a visitor to its subdomain
// suddenly can't reach anything. The bridge records this against the
// domain (see bridge/dao's own devices table) so it can show a clear
// "this account has been disabled" message instead of a generic
// connection failure, whether or not that user's process ever manages to
// reconnect. owner_uuid/domain/secret identify the *user being disabled*,
// not the primary sending this - the same identity that user's own
// process would use to register with the bridge itself. Answers with the
// generic Ack.
message ReqSetDeviceDisabled {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  bool disabled = 4;
}

// RegenerateBridgeSecret is the client-facing (device /ws, authenticated)
// request behind the Settings page's "Regenerate" button: the device looks
// up its own owner_uuid/domain/current secret and does the
// RotateBridgeSecret round trip to the bridge itself, then persists and
// returns the new secret — the web app never talks to the bridge directly.
message RegenerateBridgeSecret {
}

// Issue #62: the bridge is the only party still online when a device goes
// unreachable, so it has to be the one sending the "you're offline" alert —
// which means it needs its own copy of whatever this device would otherwise
// use to push-notify its own owner. Sent bridge-side (like
// BridgeRegister/RotateBridgeSecret above, not on the device's own
// client-facing /ws), and always the device's *current full* set of
// registrations, replacing whatever the bridge had stored for this domain
// before — simpler and self-healing (a bridge DB reset just looks like
// every device re-syncing on its next registration change) than trying to
// keep two independently-diffed copies in sync over time.
message UpdatePushRegistrations {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  repeated string apns_tokens = 4;
  repeated WebPushSub web_push_subs = 5;
  // Web Push payloads are signed with the VAPID key the browser's
  // subscription was originally created against - the bridge sending on
  // this device's behalf has to sign with the exact same keypair this
  // device already generated for itself (see push.Init), not one of its
  // own, or every send would be rejected as a signature mismatch.
  string vapid_public_key = 6;
  string vapid_private_key = 7;
}

message WebPushSub {
  string endpoint = 1;
  string p256dh = 2;
  string auth = 3;
}

message UpdatePushRegistrationsAck {
  bool ok = 1;
}

// BridgeNotify asks the bridge to deliver an iOS push on this device's
// behalf. The APNs auth key is the developer *team's* private key - whoever
// holds it can notify every install of the app - so it lives on the bridge
// alone and no device ever sees it. Note what this message does not carry:
// tokens. The bridge sends to the APNs tokens it holds for the
// authenticated domain (those this very device registered via
// UpdatePushRegistrations), so a device cannot address anyone else's
// phones by construction, not by a check. Web Push is not relayed: its
// VAPID keypair is the device's own, so the device keeps sending that
// itself. title/body are the same minimal text as ever - a friend's name
// and an action, never post content.
message BridgeNotify {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  string title = 4;
  string body = 5;
}

message BridgeNotifyAck {
  bool ok = 1;
}

message GetProfile {
}

message Profile {
  string name = 1;
  optional bytes image = 2;
  string text = 3;
  string domain = 4;
}

message ShareFilesLink {
  repeated string paths = 1;
}

message ShareLink {
  string link = 1;
}

message DownloadSharedLink {
  string uuid = 1;
  string secret = 2;
}

message NewSocial {
  string uuid = 1;
}

message SharedFiles {
  bytes content = 1;
}

message Comment {
  string pub_uuid = 1;
  string comment_uuid = 2;
  string comment = 3;
  string publisher = 4;
  int32 likes = 5;
  google.protobuf.Timestamp date_time = 6;
  // liked reports whether the requesting viewer already liked this
  // comment, so clients can render a filled vs. outline heart.
  bool liked = 7;
}

message SocialPublication {
  string uuid = 1;
  string text = 2;
  repeated File files = 3;
  repeated Comment comments = 4;
  int32 likes = 5;
  Profile publisher = 7;
  // liked reports whether the requesting viewer already liked this
  // publication, so clients can render a filled vs. outline heart.
  bool liked = 8;
  // own reports whether this is one of the device owner's own posts, so
  // clients know when to offer delete-post / delete-any-comment actions
  // (issues #34/#35).
  bool own = 9;
  // date_time is when the post was published, so clients can show it in
  // the feed (same field shape as Comment.date_time above).
  google.protobuf.Timestamp date_time = 10;
}

message SocialPublicationFiles {
  repeated File files = 1;
}

// FileExifInfo is a photo/video's camera/EXIF metadata, computed on demand
// from the file's own bytes (never stored) for the photo gallery's "More
// info" panel (issue #41). city/country are filled in from latitude/
// longitude via an offline reverse-geocode (see geotag/) whenever has_gps
// is true, the same lookup issue #42 uses to add them as searchable tags.
message FileExifInfo {
  string camera_make = 1;
  string camera_model = 2;
  google.protobuf.Timestamp taken_at = 3;
  string exposure_time = 4;
  string f_number = 5;
  int32 iso = 6;
  string focal_length = 7;
  int32 width = 8;
  int32 height = 9;
  bool has_gps = 10;
  double latitude = 11;
  double longitude = 12;
  string city = 13;
  string country = 14;
}

message GetFileInfo {
  string path = 1;
}

message SocialPublications {
  repeated SocialPublication publications = 1;
  google.protobuf.Timestamp since = 2;
}

message Event {
  string uuid = 1;
  google.protobuf.Timestamp dt = 2;
  string type = 3;
  string content = 4;
}

message Events {
  repeated Event events = 1;
  google.protobuf.Timestamp since = 2;
}

// Issue #78: the owner-facing notification timeline (bell icon) - distinct
// from Event/Events above, which is an outbound write-log friends pull
// from to sync their own cached copy of this device's activity, not
// something the owner reads directly. This device has exactly one owner
// (see Profile), so there's no recipient to filter by - every row here is
// already "for" the one person who'll ever see it. Deliberately excludes
// "a friend posted something new" - Instagram's own activity tab treats
// that as ordinary feed content too, not a notification.
enum NotificationType {
  NotificationLikePublication = 0;
  NotificationLikeComment = 1;
  NotificationNewComment = 2;
  NotificationFriendRequest = 3;
  NotificationFriendAccepted = 4;
  // Issue #64: something went wrong on the device outside any request - a
  // photo that could not be processed, a file that never made it to disk.
  // Grouped: errors within five minutes of the first share one
  // notification (see dao.AddErrorNotification), so the list is never
  // flooded. actor fields are unused; title/details/occurrences carry it.
  NotificationError = 5;
}

message Notification {
  string uuid = 1;
  google.protobuf.Timestamp dt = 2;
  NotificationType type = 3;
  string actor_name = 4;
  string actor_domain = 5;
  // pub_uuid is set for LikePublication/NewComment/LikeComment - even
  // LikeComment's own comment_uuid resolves to a pub_uuid (dao.
  // GetCommentPubUuid), so a click can always land on "the post" no
  // matter which of the three it is. Unset for FriendRequest/
  // FriendAccepted.
  string pub_uuid = 6;
  // comment_uuid is set only for LikeComment/NewComment, to additionally
  // scroll to/highlight the specific comment once the post is open.
  string comment_uuid = 7;
  bool acknowledged = 8;
  // actor_image is the acting friend's cached avatar (social_friendship.
  // image), shown at the left of the row - unset if that friend has no
  // avatar cached.
  optional bytes actor_image = 9;
  // thumbnail is a small preview of the post/comment this notification
  // points to (pub_uuid's first file), shown at the right of the row -
  // unset for FriendRequest/FriendAccepted, which point at no post.
  optional bytes thumbnail = 10;
  // Issue #64, NotificationError only: the one line shown in the list (the
  // first error's), every error's line in arrival order (shown on hover or
  // tap), and how many errors the row stands for.
  string title = 11;
  string details = 12;
  int32 occurrences = 13;
}

message ReqListNotifications {
  int32 limit = 1;
}

message RespNotifications {
  repeated Notification notifications = 1;
}

message ReqGetNotificationCount {
}

message RespNotificationCount {
  int32 unacknowledged_count = 1;
}

// Answers with the generic Ack.
message ReqMarkNotificationsAcknowledged {
}

// A single-post fetch, new for issue #78: tapping a notification for a
// post that isn't among whatever page of the feed happens to be loaded
// needs to be able to pull just that one post to open/scroll to.
message ReqGetPublication {
  string pub_uuid = 1;
}

message RespPublication {
  SocialPublication publication = 1;
}

// Issue #82: multiple OTC "users" on one device, each a fully separate
// process/port/database/storage-directory, managed from the PRIMARY
// instance's Settings screen only (see ReqGetInstanceRole) - see
// supervisor/supervisor.go's doc comment for the full design. Issue #89:
// there is deliberately no is_admin/promote concept here - the original
// device owner (whoever is logged into the primary instance) is the only
// admin there will ever be; every other user is just a user.
message User {
  string uuid = 1;
  string username = 2;
  int32 port = 3;
  string subdomain = 4;
  // 5 was is_admin (issue #82) - removed by issue #89, left unused
  // rather than renumbering active/created after it.
  bool active = 6;
  google.protobuf.Timestamp created = 7;
  // Issue #103: false for a local-only user (one created without
  // requesting bridge access) - it has no registration on the bridge and
  // is reachable only on this machine's own network.
  bool bridge_access = 8;
}

message ReqListUsers {}

message RespUsers {
  repeated User users = 1;
}

// port is optional - omit it (0) to let the primary pick the next free
// one itself.
message ReqCreateUser {
  string username = 1;
  int32 port = 2;
  // Issue #103: whether this user should be reachable from outside the
  // house, i.e. registered on the bridge as <username>.<bridge-addr>.
  // When set, the device asks the bridge whether that subdomain is free
  // *before* provisioning anything (see ReqIsDomainAvailable) and refuses
  // to create the user if it isn't - a subdomain already claimed by some
  // other registration can never be claimed by this one, so creating the
  // user anyway produces an account that looks fine in the panel and is
  // silently unreachable forever, with the only evidence buried in that
  // user's own log ("bridge rejected registration: Invalid Secret").
  // Hit exactly that way on a live device before this existed.
  bool request_bridge_access = 3;
}

// confirm_username must match username exactly - checked server-side too,
// never trusted from the client alone, since this deletes a whole
// database and storage directory.
message ReqDeleteUser {
  string uuid = 1;
  string confirm_username = 2;
}

// Issue #90: enable/disable a user's access without deleting their
// database or storage - unlike ReqDeleteUser this is fully reversible.
// Disabling actually stops that user's running process immediately
// (supervisor.Stop), not just a flag flip that only takes effect next
// time it happens to restart; enabling spawns it again right away.
// Answers with the generic Ack.
message ReqSetUserActive {
  string uuid = 1;
  bool active = 2;
}

message ReqGetUserMetrics {
  string uuid = 1;
}

message RespUserMetrics {
  double storage_mb = 1;
  double storage_pct = 2;
  int32 active_connections = 3;
}

// Lets a Settings screen know whether it's talking to the primary
// instance (and should render the Users section) or one of the spawned
// per-user instances (which never expose user management, even if a
// request reaches it directly - see websocket.go's guard on every other
// RPC above).
message ReqGetInstanceRole {}

message RespInstanceRole {
  bool is_primary = 1;
}

message GetFriendshipStatus {
  string domain = 1;
  string secret = 2;
}

// FriendshipStatusReply, not FriendshipStatus: that name differs from the
// enum FriendShipStatus only by case, and the Java/Kotlin generators put
// each type in its own file (and class file), which collide on a
// case-insensitive filesystem - macOS, where the Android app is built.
message FriendshipStatusReply {
  FriendShipStatus status = 1;
  // Issue #25: true when the asked-about device holds no friendship for
  // that domain+secret at all - which, for a sender still holding a
  // pending request, means the receiver deleted it. Distinct from an error
  // so a network or database problem never reads as "they declined".
  bool not_found = 2;
}

message AuthAsFriend {
  string domain = 1;
  string secret = 2;
}

// Issue #95: the bridge fetches a device's static web assets (the SPA
// bundle, index.html, favicons, etc.) through this RPC now, over the same
// tunnel every other request already uses, instead of keeping its own
// separate copy that had to be redeployed by hand every time a device's
// own build changed. path is a URL path exactly as a browser requested it
// (e.g. "/assets/index-abc123.js", "/", "/social") - the device resolves
// it the same way its own HTTP static handler does (see
// staticassets.Resolve), and only ever answers with a file that already
// exists inside its own static assets directory: nothing else on the
// device is reachable through this, regardless of what path asks for.
message ReqGetStaticAsset {
  string path = 1;
}

message RespStaticAsset {
  bytes content = 1;
  string content_type = 2;
}

message ReqEnvelope {
  int32 id = 1;
  oneof payload {
    ListFiles req_list_files = 10;
    GetStatus req_get_status = 11;
    Auth req_auth = 12;
    UploadFile req_upload_file = 13;
    GetFile req_get_file = 14;
    DelFile req_del_file = 15;
    SearchPhotos req_search_photos = 16;
    GetTags req_get_tags = 17;
    ChangeKey req_change_key = 18;
    GetSettings req_get_settings = 28;
    SetSettings req_set_settings = 29;
    NewSocialPublication req_new_social_publication = 19;
    GetSocialPublications req_get_social_publications = 20;
    GetSocialPublicationFiles req_get_social_publication_files = 42;
    FriendshipRequest req_friendship_request = 23;
    FriendshipInterRequest req_friendship_inter_request = 37;
    DidSendFriendshipReq req_did_send_friendship_req = 38;
    FriendshipsList req_friendships_list = 35;
    ChangeFriendStatus req_change_friend_status = 36;
    GetFriendshipStatus req_get_friendship_status = 39;
    AuthAsFriend req_auth_as_friend = 40;
    NewSocialComment req_new_social_comment = 21;
    GetEvents req_get_events = 41;

    DelSocialComment req_del_social_comment = 22;
    LikePublication req_like_publication = 25;
    LikeComment req_like_comment = 26;

    BridgeRegister req_bridge_register = 30;
    GetProfile req_get_profile = 31;
    Profile req_set_profile = 32;
    ShareFilesLink req_share_files_link = 33;
    DownloadSharedLink req_download_shared_link = 34;
    GetPubKey req_get_pub_key = 43;
    GetPublicationLikers req_get_publication_likers = 44;
    GetCommentLikers req_get_comment_likers = 45;
    DelSocialPublication req_del_social_publication = 46;
    GetFileInfo req_get_file_info = 47;
    SetBridgeSecret req_set_bridge_secret = 48;
    ListStorageDevices req_list_storage_devices = 49;
    SetupStorage req_setup_storage = 50;
    RegenerateBridgeSecret req_regenerate_bridge_secret = 51;
    RotateBridgeSecret req_rotate_bridge_secret = 52;
    ListWifiNetworks req_list_wifi_networks = 53;
    SetWifi req_set_wifi = 54;
    RegisterWebPush req_register_web_push = 55;
    RegisterApnsToken req_register_apns_token = 56;
    GetVapidPublicKey req_get_vapid_public_key = 57;
    HasFile req_has_file = 58;
    LinkFile req_link_file = 59;
    UpdatePushRegistrations req_update_push_registrations = 60;

    // Issue #52: face recognition (person search, folded into
    // SearchPhotos.person_ids above rather than its own RPC).
    SetFaceRecognitionEnabled req_set_face_recognition_enabled = 61;
    ListPeople req_list_people = 62;
    RenamePerson req_rename_person = 63;
    DeletePerson req_delete_person = 64;
    // Issue #74.
    MergePeople req_merge_people = 65;
    // Issue #73.
    StartReprocess req_start_reprocess = 66;
    GetReprocessStatus req_get_reprocess_status = 67;
    StopReprocess req_stop_reprocess = 68;
    // Issue #77: date scrubber.
    ReqPhotoDateBuckets req_photo_date_buckets = 69;
    // Issue #78: notifications.
