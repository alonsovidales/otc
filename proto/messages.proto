message RespEnvelope {
  int32 id = 1;
  bool error = 2;
  string error_message = 3;
  // Machine-readable reason when error is set, for the cases a client has
  // to act on rather than just show: "upload_only" (issue #132: a delete
  // under an upload-only folder - a sync client must not retry it),
  // "out_of_images_by_parent" (issue #192: SetOutOfImages can't show a
  // folder inside another one kept out of Images; the message names it),
  // "duplicated_file" (an upload or link onto a path that is taken - photo
  // sync renames and retries; devices before it send only the message,
  // ending in "Duplicated file", which clients check when the code is empty),
  // "copy_upload_only" (issue #201: a DelFile with every_copy refused as a
  // whole, because one of the copies, maybe the path asked for, is in an
  // upload-only folder; nothing was deleted, and the message names that
  // folder), "changed" (issue #201: a DelFile whose hash is no longer the
  // content at its path; nothing was deleted - refresh and ask again),
  // "places_off" (GetPhotoPlaces while Places is off: hide the map).
  string error_code = 4;
  oneof payload {
    Status resp_status = 10;
    Ack resp_ack = 11;
    File resp_file = 12;
    ListOfFiles resp_list_of_files = 13;
    TagsList resp_tags_list = 14;
    Settings resp_settings = 15;
    BridgeAckOnboard resp_bridge_ack_onboard = 16;
    Profile resp_profile = 17;
    ShareLink resp_share_link = 18;
    Friendships resp_friendships = 19;
    SharedFiles resp_shared_files = 20;
    NewSocial resp_new_social = 21;
    SocialPublications resp_social_publications = 22;
    SocialPublicationFiles resp_social_publication_files = 25;
    FriendshipStatusReply resp_friendship_status = 23;
    Events resp_events = 24;
    PubKey resp_pub_key = 26;
    Likers resp_likers = 27;
    FileExifInfo resp_file_info = 28;
    StorageDevices resp_storage_devices = 29;
    RotateBridgeSecretAck resp_rotate_bridge_secret_ack = 30;
    WifiNetworks resp_wifi_networks = 31;
    VapidPublicKey resp_vapid_public_key = 32;
    FileExists resp_file_exists = 33;
    UpdatePushRegistrationsAck resp_update_push_registrations_ack = 34;

    // Issue #52: face recognition (person search). RenamePerson/
    // DeletePerson/SetFaceRecognitionEnabled all just answer with the
    // generic Ack above.
    People resp_people = 35;
    // Issue #73.
    ReprocessStatus resp_reprocess_status = 36;
