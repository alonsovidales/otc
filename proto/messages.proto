    ReqGetUserMetrics req_get_user_metrics = 78;
    ReqGetInstanceRole req_get_instance_role = 79;
    // Issue #90.
    ReqSetUserActive req_set_user_active = 80;
    // Issue #95.
    ReqGetStaticAsset req_get_static_asset = 81;
    ReqGetMediaURL req_get_media_url = 88;
    ReqGetMediaRange req_get_media_range = 89;
    ReqCheckUpdate req_check_update = 90;
    ReqApplyUpdate req_apply_update = 91;
    ReqSetupTailscale req_setup_tailscale = 92;
    ReqGetTailscaleStatus req_get_tailscale_status = 93;
    // Issue #115: image groups.
    ListImageGroups req_list_image_groups = 94;
    CreateImageGroup req_create_image_group = 95;
    AddToImageGroup req_add_to_image_group = 96;
    RenameImageGroup req_rename_image_group = 97;
    DeleteImageGroup req_delete_image_group = 98;
    // APNs relayed through the bridge, which alone holds the team key.
    BridgeNotify req_bridge_notify = 99;
    BridgeClientInfo req_bridge_client_info = 100;
    DeleteFriendship req_delete_friendship = 101;
    FriendshipInterDelete req_friendship_inter_delete = 102;
    // Answers with resp_cloud_ids_found.
    HasCloudIds req_has_cloud_ids = 103;
    // Issue #132. Answers with the generic Ack.
    SetUploadOnly req_set_upload_only = 104;
    // Issue #132. Answers with resp_file_versions.
    ListFileVersions req_list_file_versions = 105;
    // Issue #131. Both answer with the generic Ack.
    UnregisterApnsToken req_unregister_apns_token = 106;
    UnregisterWebPush req_unregister_web_push = 107;
    // Issue #93. Answers with the generic Ack.
    ReqSetDeviceDisabled req_set_device_disabled = 82;
    // Issue #101: session tokens in place of a password in localStorage.
    ReqIssueSessionToken req_issue_session_token = 83;
    ReqAuthWithToken req_auth_with_token = 84;
    // Answers with the generic Ack.
    ReqRevokeSessionToken req_revoke_session_token = 85;
    // Issue #103.
    ReqIsDomainAvailable req_is_domain_available = 86;
    // Issue #107. Answers with the File (resp_file) above.
    GetPublicationMedia req_get_publication_media = 87;
  }
}

message RespEnvelope {
  int32 id = 1;
  bool error = 2;
