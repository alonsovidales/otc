syntax = "proto3";

import "google/protobuf/timestamp.proto";

package msg;

option go_package = "github.com/alonsovidales/otc/proto/generated;msg";
// Android app (issue #88): protoc --java_out/--kotlin_out. Java-only
// options, ignored by the Go/TS/Swift generators.
option java_package = "cloud.offthe.otc.proto";
option java_multiple_files = true;
option java_outer_classname = "MessagesProto";

enum StatusErrorCode {
  DiskError = 0;
  Syncing = 1;
  MissingDisk = 2;
  ErrorInDisk = 3;
}

message StatusErrors {
  StatusErrorCode StatusErrorCode = 1;
  string Message = 2;
}

message GetStatus {
}

// Issue #65: RAID health as its own explicit state, not something the
// client has to infer from errors being present/absent. NoRaid covers a
// device with no md array at all (e.g. a single-disk test box) as distinct
// from Unknown (an array exists but /proc/mdstat couldn't be parsed) —
// both render as "no bar to draw", but they're different enough
// conditions to keep separate rather than collapsing to one "n/a" value.
enum RaidState {
  RaidUnknown = 0;
  RaidNone = 1;
  RaidInSync = 2;
  RaidSyncing = 3;
  RaidDegraded = 4;
}

message Status {
  bool online = 1;
  reserved 2; // was local_ip - issue #65: a device's IP has no place in
              // its own status readout, and nothing ever actually
              // populated this field to begin with.
  reserved "local_ip";
  int32  disks = 3; // total physical devices in the RAID array (0 if none)
  repeated StatusErrors  errors = 4;
  int32  raid_size = 5;
  int32  raid_usage = 6;
  int32  disk_size = 7;
  int32  disk_usage = 8;
  float  cpu_usage_prc = 9;
  int32  mem_size = 10;
  int32  mem_usage = 11;
  // Issue #65: parsed from /proc/mdstat - see status.readRaidStatus.
  RaidState raid_state = 12;
  string raid_level = 13;           // e.g. "raid1", "raid5"; "" if no array
  int32 raid_devices_active = 14;   // active/in-sync devices, out of `disks`
  float raid_sync_percent = 15;     // only meaningful when raid_state == Syncing
  // Issue #183: a major or critical update this device hasn't installed
  // yet (unset when there is none). Every app polls Status, so a critical
  // one reaches them all: they show a banner until it's installed.
  UpdateAlert update_alert = 16;
  // Localization: Settings.language, here too so every app picks up a
  // change made from another one. Absent on devices that predate it, and
  // on a demo device, where each visitor keeps their own choice.
  optional string language = 17;
  // A public demo device ([otc] demo = true): anyone may sign in with its
  // published password and look around, and it refuses every change
  // (RespEnvelope.error_code "demo"). The apps show a banner, hide what
  // would change something and never upload this phone's photos to it.
  bool demo = 18;
  // Settings › Storage: disks plugged in while the mirror is missing one
  // that the device didn't add by itself because something is on them
  // (it adds only a blank disk or a former member of the mirror). The
  // owner may have one erased and added with UseMirrorDisk. Only for the
  // owner of the primary instance of a Raspberry Pi (none in a container,
  // on a demo device or on a user's instance), and only while the mirror
  // has a slot with no working disk - none while a replacement is being
  // copied onto. Empty on devices before it.
  repeated MirrorDiskCandidate mirror_candidates = 19;
}

// A disk Settings offers for the mirror (Status.mirror_candidates).
message MirrorDiskCandidate {
  // Names this disk while it stays plugged in: opaque, 20 lowercase hex
  // digits. Any other disk - this one too, once unplugged and plugged in
  // again, or after a restart - gets another. UseMirrorDisk.disk.
  string id = 1;
  // What the disk calls itself, its vendor and model as it reports them
  // ("Generic Card Reader", "Samsung PSSD T7"); may be empty. Shown as
  // it is.
  string model = 2;
  // Its size in bytes.
  int64 size = 3;
}

// Issue #183: releases are minor, major (security, stability or durability)
// or critical (breaks compatibility with the bridge or the apps if not
// installed, or a serious security fix).
message UpdateAlert {
  string level = 1;   // "major" or "critical"
  string version = 2; // the version it updates to, e.g. "2.0"
  string summary = 3;
}

message Auth {
  string uuid = 1;
  // RSA-OAEP(SHA-256) ciphertext of the password, encrypted by the client
  // using the public key returned by GetPubKey/PubKey for this connection.
  bytes key = 2;
  bool create = 3;
}

// Issue #101: a browser has no Keychain/vault of its own to replay a real
// password from on reload the way the native apps do, so it used to keep
// the actual account password sitting in plain localStorage instead (see
// web/src/net/pwCrypto.ts) - anything that could read that origin's
// storage got the real password, not just a way back into one session.
// IssueSessionToken mints a random opaque token for the connection's
// *already established* session (so this is authenticated-only, unlike
// Auth itself) that AuthWithToken can redeem on some later connection in
// place of the password - see session/tokens.go for the server-side
// store, and its own doc comment for why every redemption mints a fresh
// token rather than counting down from the original login.
message ReqIssueSessionToken {
}

message SessionToken {
  string token = 1;
  int64 expires_at_unix_ms = 2;
}

message RespSessionToken {
  SessionToken session_token = 1;
}

// Pre-auth, like Auth itself - answers with the same generic Ack shape
// Auth does (Ok, or ErrorMsg on an expired/unknown/already-redeemed
// token). A client that gets Ok back still needs its own follow-up
// IssueSessionToken call to keep a fresh token in storage, since redeeming
// one consumes it (see RedeemToken).
message ReqAuthWithToken {
  string token = 1;
}

// Issue #103: asked by a device before it provisions an additional user,
// so a subdomain that is already spoken for is caught up front instead of
// becoming an unreachable account. Answers with RespDomainAvailable.
//
// Authenticated as an existing registered device (owner_uuid/domain/secret
// - the asking device's own, verified the same way ReqSetDeviceDisabled
// and ReqRotateBridgeSecret verify theirs) rather than being open to
// anyone. Without that this would be an anonymous "does <name> exist?"
// oracle on a public relay, letting anybody enumerate which subdomains -
// and therefore which people - are registered here.
message ReqIsDomainAvailable {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  // The subdomain being considered, e.g. "pepe.off-the.cloud".
  string candidate_domain = 4;
}

// The primary registering one of its additional users' addresses
// (issue #103, "pepe.off-the.cloud") under its own account. Since issue
// #124 the bridge refuses an address that dials in unless an account holds
// it, and nothing else gave a user's address one, so every user created
// with bridge access was turned away. Authenticated as the primary
// (owner_uuid, domain, secret, as ReqIsDomainAvailable); user_* is the
// identity the user's own instance registers with. The address counts
// toward the account's limit like any other (accounts.MaxDomains).
// Idempotent: an address the account already holds for that identity is
// ok, and one it holds for another identity (a user deleted and added
// again under the same name) is handed to this one. A primary whose own
// domain predates accounts registers it without one, as it registered
// itself. Answers with the generic Ack; a refusal sets
// RespEnvelope.error_code: "name_taken", "name_held", "domain_limit" or
// "invalid_name". Bridges before it answer unknown_payload.
message ReqRegisterUserDomain {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  // The user's address, "<username>.<the bridge's domain>".
  string user_domain = 4;
  string user_owner_uuid = 5;
  string user_secret = 6;
}

message RespDomainAvailable {
  bool available = 1;
}

// Sent when the owner explicitly signs out (see SettingsForm's Sign Out
// button) so a token that's already sitting in some other tab's storage
// stops working immediately, rather than just quietly expiring on its own
// TTL. Answers with the generic Ack.
message ReqRevokeSessionToken {
}

// GetPubKey requests the ephemeral RSA public key generated for this
// WebSocket connection. Clients must call this before sending Auth or
// ChangeKey, and use it to encrypt the key material client-side so that
// the plaintext password never crosses the bridge, which only relays
// already-encrypted application payloads between device and client.
message GetPubKey {
}

message PubKey {
  // PKIX/SPKI DER-encoded RSA public key, valid only for this connection.
  bytes public_key = 1;
  // True when this device has no owner secret set up yet (issue #39) —
  // every client already calls GetPubKey before Auth, so this is the
  // cheapest place to tell a fresh device apart from a normal login
  // without a dedicated round trip. Clients should show a first-run setup
  // flow (device password + owner name) instead of a plain sign-in form.
  bool is_new_device = 2;
  // Issue #85: false on an additional user's own instance (issue #82's
  // per-user child process), true on the device's primary one. Rides
  // along here for the same reason is_new_device does - the first-run
  // wizard has to decide what to show *before* anyone is authenticated,
  // so it can't use the authenticated ReqGetInstanceRole the Settings
  // screen uses for the same question. What it decides: a child instance
  // is asked only for an owner name and password, never the storage or
  // WiFi steps, because those configure the shared physical machine and
  // belong solely to the primary (which is also enforced server-side -
  // see the guards on ReqSetupStorage/ReqSetWifi).
  bool is_primary = 3;
  // A public demo device (see Status.demo), told before sign-in so the
  // sign-in screen can say so.
  bool demo = 4;
  // A demo device's published password ([otc] demo-password), so its
  // sign-in screen can sign anyone in with one tap. Empty on every other
  // device.
  string demo_password = 5;
  // The device runs from the container image (docker/, OTC_CONTAINER): the
  // server it runs on looks after its disks and its network, so the
  // first-run setup skips the storage and WiFi steps, as it does on an
  // additional user's instance. Unset on every other device.
  bool container = 6;
}

message UploadFile {
  string path = 1;
  bytes content = 2;
  bool forceOverride = 3;
  google.protobuf.Timestamp created = 4;
  // The photo library's own identifier for the asset this came from (iOS:
  // PHCloudIdentifier, the same on every device signed into the owner's
  // iCloud account; Android has nothing comparable, its MediaStore ids are
  // one phone's row numbers). The device keeps it next to the content hash
  // so another phone, or this one after a reinstall, can recognise the
  // asset with HasCloudIds instead of downloading it from iCloud to hash it.
  string cloud_id = 5;
  // Issue #134: the file's own modification time, kept as the device's
  // `modified` (created above is its creation time), so a file synced
  // down elsewhere gets the same dates it had. Unset: the upload time.
  google.protobuf.Timestamp modified = 6;
}

// Issue #58: lets a sync client (iOS/macOS) check whether this device
// already has a file with this content before sending it - storage is
// already deduplicated by hash server-side (multiple paths can share one
// on-disk blob), this just lets a client find that out *before* spending
// the bandwidth on a re-upload, not just after.
message HasFile {
  string hash = 1;
  // Optional: the asset's cloud id (see UploadFile.cloud_id). When the hash
  // is on the device, it is attached to every row with that hash - this is
  // how content that was uploaded before cloud ids existed, or from another
  // platform, gets one.
  string cloud_id = 2;
}

// HasCloudIds: which of these cloud ids (UploadFile.cloud_id) does the
// device already hold, and under which content hash - the answer that lets
// a photo sync skip the iCloud download and just LinkFile the hash.
message HasCloudIds {
  repeated string cloud_ids = 1;
}

message CloudIdFile {
  string cloud_id = 1;
  string hash = 2;
}

message CloudIdsFound {
  repeated CloudIdFile files = 1;
}

// Free up space (the phones): which of these contents, by SHA-256, does the
// device hold whole - asked right before a phone deletes its own copies of
// photos and videos. A hash counts when a `files` row has it and its blob
// is on the disk at exactly the size that row's content seals to
// (segcrypt.EncryptedSize), looked at on the disk for every request, never
// remembered. At most 1000 hashes are looked at (the phones ask 500 at a
// time); anything that isn't 64 lowercase hex digits is left out. Older
// devices answer "unknown_payload", and the phones ask HasFile for each.
message HasHashes {
  repeated string hashes = 1;
}

// The answer to HasHashes: the hashes asked for that the device holds, each
// once, in no particular order.
message HashesFound {
  repeated string hashes = 1;
}

message FileExists {
  bool exists = 1;
}

// LinkFile registers `path` as pointing at content this device already
// has (hash), without transferring it again - the client is expected to
// have confirmed via HasFile first that the hash actually exists here;
// the server verifies that itself too and rejects the request if not,
// rather than trusting the claim blindly.
message LinkFile {
  string hash = 1;
  string path = 2;
  bool forceOverride = 3;
  google.protobuf.Timestamp created = 4;
  // See UploadFile.cloud_id.
  string cloud_id = 5;
  // See UploadFile.modified.
  google.protobuf.Timestamp modified = 6;
}

message DelFile {
  string path = 1;
  // Issue #201: Images' "delete every copy". When true, the device
  // deletes every path in Files that holds the same content as this one
  // (File.copies counted them): all of `files`' rows with its hash,
  // wherever they are, folders kept out of Images included, each with its
  // older versions, as its own DelFile would. It answers Ack ok once all
  // are gone. It is all or nothing: if any of those paths (this one
  // included) is in an upload-only folder, nothing is deleted and the
  // answer is error_code "copy_upload_only", with a message naming that
  // folder. Older versions that other paths keep (ListFileVersions) are not
  // copies, so they stay, and so does the content they hold. This applies
  // to a file only: a folder's path deletes the folder as before (issue
  // #116) and ignores the flag. Unset or false deletes only this path, as
  // before. A device that sets File.copies honours it. Devices before #201
  // ignore it and delete only this path. Optional (has/hasEveryCopy), so
  // that requests typed before it, like the web's, stay valid.
  optional bool every_copy = 2;
  // Issue #201: the content hash the client showed for this path (File.hash
  // of the tile or row it was deleted from). When set and the path is a
  // file that now holds other content (synced over or edited since it was
  // shown), the device deletes nothing and answers error_code "changed",
  // with a message saying so - with or without every_copy, which would
  // otherwise delete every copy of content the person never saw. Checked
  // before anything is deleted. Ignored for a folder's path, and when
  // empty (a listing shows no hash for a file whose content is missing,
  // issue #141). Devices before it ignore it. Optional (has/hasHash), so
  // that requests typed before it, like the web's, stay valid.
  optional string hash = 3;
}

message GetFile {
  string path = 1;
  // Issue #132: an older version's hash (from ListFileVersions) serves that
  // version's content instead of the current one.
  string hash = 2;
}

// Issue #132: mark a folder upload only (or clear it). Nothing under an
// upload-only folder can be deleted, and a second upload to a path that
// already exists keeps the old content as a version instead of replacing
// or refusing it.
message SetUploadOnly {
  string path = 1;
  bool upload_only = 2;
}

// Issue #132: the older versions of a path in an upload-only folder, newest
// first. Each entry's `modified` is when it stopped being the current one;
// its hash is what GetFile.hash takes.
message ListFileVersions {
  string path = 1;
}

message FileVersions {
  repeated File versions = 1;
}

// Issue #192: keep a folder out of Images, or show it there again. Photos
// and videos under a folder kept out still get thumbnails (Files shows
// them) but are never tagged or searched for faces, and Images - the photo
// search, its tags, People, collections - leaves them out; keeping one out
// deletes the tags and faces found in content no other path holds, and
// showing it again analyses that content in the background (tags, faces
// when face recognition is on). Answers with the generic Ack. Refused with
// error_code "out_of_images_by_parent" when out_of_images is false for a
// folder inside another one kept out (the message names it). Devices
// before release 108 answer "unknown_payload".
message SetOutOfImages {
  string path = 1;
  bool out_of_images = 2;
}

// Issue #192: every folder kept out of Images, each with its trailing
// slash - what the computer apps show next to their folders. Answers with
// OutOfImagesFolders.
message ListOutOfImages {}

message OutOfImagesFolders {
  repeated string paths = 1;
}

message ListFiles {
  string path = 1;
  bool recursive = 2;
}

// Issue #195: Files' Storage view, which shows what takes the space in one
// folder. The apps ask for it only while that view is open; ListFiles never
// sizes folders. Answers with FolderUsage. Sizes are logical: each file at
// its own size in bytes, as File.size64. Content held at two paths counts
// at both, though the device stores it once. Encryption, thumbnails,
// posts, shared galleries, other users and the database aren't counted, so
// the figures don't add up to the device's storage bar. Same callers as
// ListFiles. Devices before #195 answer error_code "unknown_payload".
message GetFolderUsage {
  // The folder as ListFiles takes it, with its trailing slash ("/" for the
  // root). One without the slash is taken as that folder.
  string path = 1;
}

// One direct child of the folder asked for (GetFolderUsage).
message FolderUsageEntry {
  // Its full path, as ListFiles lists it: a folder's has no trailing
  // slash. A file and a folder can share a name (made from two computers),
  // and then they are two entries told apart by is_dir.
  string path = 1;
  // A folder (everything under path + "/"), or a file.
  bool is_dir = 2;
  // Bytes of the current files: a file's own size, or for a folder every
  // file under it at any depth.
  int64 files_size = 3;
  // How many files that is (1 for a file). 0 only for a child that holds
  // nothing but older versions.
  int32 file_count = 4;
  // Bytes of the older versions kept of those files (upload-only folders,
  // issue #132, ListFileVersions). They are not part of files_size: the
  // entry's whole size is files_size + versions_size.
  int64 versions_size = 5;
}

// The answer to GetFolderUsage.
message FolderUsage {
  // The folder asked for, with its trailing slash. A client that has moved
  // to another folder drops an answer whose path isn't the one it shows.
  string path = 1;
  // Every direct child that holds a file or an older version, largest
  // first (files_size + versions_size), then by path, then a folder before
  // a file of the same name. Empty for an empty or unknown folder.
  repeated FolderUsageEntry entries = 2;
  // The folder's own totals: every file under it at any depth, the sums
  // of the entries' fields.
  int64 files_size = 3;
  int32 file_count = 4;
  int64 versions_size = 5;
}

// The Files grid's thumbnails: for each path that is a photo or video with
// a stored thumbnail, a File with its path, mime and the thumbnail as
// content; any other path is left out. At most 48 paths, and about 8 MB of
// thumbnails, per request. Answers with ListOfFiles.
message GetThumbnails {
  repeated string paths = 1;
  // The grids' small thumbnails (release 111) instead of the big ones:
  // the shorter side 400 px, the longer at most 800, the picture's own
  // aspect (crop it to the tile; never assume a square), JPEG. Content
  // that has no small one yet comes with its big one as stored, and gets
  // a small one shortly after. A big one made before release 111 was
  // capped by width only - 1000x1333 for a portrait, 1000 px wide and
  // any height for a long screenshot - until the device rescales it, so
  // assume no bound on its size. Devices before release 111 ignore the
  // flag and send those; clients that don't set it keep getting big
  // ones. No size tells them apart (an 800x600 photo's big one is
  // 800x600 and its small one 533x400; a panorama's big one can be
  // 1000x250): since release 113 each entry of this answer and of
  // SearchPhotos says whether its content is the small one
  // (File.thumbnail_small); before that answers didn't say, so keep a
  // thumbnail by what was asked for, not by its size. The same flag, with
  // the same meaning, is on SearchPhotos, ListImageGroups and
  // CreateImageGroup. A viewer may show an item's small tile until its
  // full size arrives; where a thumbnail is what stays on screen (the
  // full size couldn't be fetched, decoded or played) it asks for the big
  // one: this request without the flag.
  //
  // Up to 48 paths and about 8 MB of thumbnails a request: the answer
  // lists the paths that have one, in the order asked, and
  // ListOfFiles.ask_again_from says where it stopped short. Each entry
  // carries its path's current hash (key a cache by that, not by the
  // hash the path had when it was listed). A grid that keeps thumbnails
  // asks only for the ones it lacks (see SearchPhotos.omit_thumbnails).
  bool small_thumbnails = 2;
}

// The top bar's search: the files and folders whose path contains query
// (case-insensitive), as ListFiles would list them, best matches first -
// a name that starts with the text, then a name that contains it, then a
// folder on the way; shorter paths first within each. At most limit (20
// when unset, 50 at most). Case and accents don't count. A query longer
// than any path could be (12 KB) finds nothing. Answers with ListOfFiles
// (no token).
message SearchFiles {
  string query = 1;
  int32 limit = 2;
}

// Settings > Logs: a piece of the device's own log (source "app") or of
// the update log ("update"), from byte offset (-1: the last max_bytes), at
// most max_bytes (256 KB at most). Answers with Logs. Primary instance
// only. next_offset is where to ask from next (see wait_seconds).
message GetLogs {
  string source = 1;
  int64 offset = 2;
  int32 max_bytes = 3;
  // The live view: with nothing after offset yet, the device holds the
  // request until the log grows or this many seconds pass (25 at most), so
  // new lines show up the moment they're written - a stream over plain
  // requests, which the bridge relays as they are.
  int32 wait_seconds = 4;
}

message Logs {
  string text = 1;
  int64 next_offset = 2;
  // The log's size now; smaller than the offset asked for means it was
  // rotated, and text starts again from its beginning.
  int64 size = 3;
}

// Settings > Logs > "Send to us": the device mails the last part of both
// logs, with the owner's note, to the project through the bridge
// (BridgeSendLogs). Answers with Ack. Needs the bridge.
message SendLogs {
  string note = 1;
}

// Sent by a device to the bridge, authenticated like RotateBridgeSecret by
// its secret: the bridge mails the logs (gzip) to the project's address.
// Answers with Ack.
message BridgeSendLogs {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  string note = 4;
  bytes logs = 5;
}

message SearchPhotos {
  repeated string tags = 1;
  string token = 2;
  // include_videos (issue #60): the Photo Gallery's own search stays
  // images-only (its default, unset value), but the social composer wants
  // to offer videos alongside photos too - both share this one RPC, so a
  // caller opts in explicitly rather than the gallery silently gaining
  // videos it never asked for.
  bool include_videos = 3;
  // person_ids (issue #52 follow-up): filters to photos containing a face
  // matched to *every* person listed here (AND, not OR) - "person X with
  // dogs" means combining this with tags = ["dogs"] on the same request,
  // not two separate searches. Lives on the Photo Gallery's own search bar
  // now, not a separate People screen.
  repeated string person_ids = 4;
  // Issue #77: the date scrubber's "jump to date". When set, the server
  // always starts a *fresh* search filtered to created <= before and
  // hands back a new token (any existing token is ignored) - rather than
  // a real seekable SQL cursor, this piggybacks the existing token
  // mechanism (files_manager.ImageSearch already computes the whole
  // filtered/sorted result set once per token) by treating a jump exactly
  // like a brand new search.
  google.protobuf.Timestamp before = 5;
  // How many results the client already holds, sent so a search can be
  // resumed when the device no longer recognises the token.
  //
  // Tokens are an in-memory cache of the whole result set: they expire
  // after a few minutes of not scrolling, and a device restart drops all
  // of them. Without this the device can only start the search over and
  // hand back page one again - photos the client already has, which it
  // discards, so the grid appears to have run out partway down. With it,
  // a resumed search skips straight to where the client actually was.
  //
  // Only meaningful alongside a token (i.e. when resuming); a search
  // starting from scratch sends nothing and is never skipped forward.
  //
  // With a token the device still holds, it also makes a page asked again
  // with the same have (its answer was lost) come back as the same page,
  // instead of the page after it, which left a hole in the grid.
  int32 have = 6;
  // Issue #115: restrict to one image group (album). A group is just
  // another filter on this same search - combined with tags/people
  // exactly like they combine with each other - which is what keeps
  // search and scrolling working unchanged inside a group.
  string group_id = 7;
  // The most photos this page may hold. A grid asks for a small first
  // page so it paints quickly over a slow upload, and continues with the
  // device's own size. 0 (unset, and all a device before release 97 sees)
  // means the device's default ([tagger] max-images-search, 30); the
  // device never returns more than its default - except for a page
  // without thumbnails (omit_thumbnails, release 113), which may hold up
  // to 200.
  int32 limit = 8;
  // Each File's content is its small thumbnail (see
  // GetThumbnails.small_thumbnails) instead of the big one: for grids,
  // and for a viewer only until the full size arrives (see there).
  bool small_thumbnails = 9;
  // Release 113: the page's Files come without content - everything else
  // as before (hash, path, mime, dates, size) - for a client that keeps
  // the thumbnails it got (the phones' cache, by hash) and asks
  // GetThumbnails for the ones it lacks. The page is the same page either
  // way: the same photos in the same order, only those processed (whose
  // thumbnail exists, issue #147, here checked without reading it), the
  // same token, and have means the same; a token's pages may mix both.
  // The one difference: a thumbnail stored but unreadable is listed here
  // (a page with thumbnails leaves it out), and then left out of the
  // GetThumbnails answer. With small_thumbnails too, File.thumbnail_small
  // says whether a small thumbnail is stored for the photo (see there).
  // Such a page may be bigger: limit up to 200 is honoured (0 is still the
  // device's default, 30; with thumbnails a limit only ever shrinks a
  // page). Devices before release 113 ignore the flag and send content,
  // and a page of at most their default: clients take the content when an
  // entry has it and fetch only entries that don't.
  bool omit_thumbnails = 10;
  // Issue #194: scrolling up after a jump (before). This asks for the
  // photos dated strictly after this instant, served OLDEST first, the
  // opposite of every other page; the answer says so
  // (ListOfFiles.oldest_first). A jump's `before` and this, with the same
  // instant, split the library exactly: nothing is missing and nothing
  // comes twice. That relies on each photo having one date since #201: its
  // oldest copy's (see File.copies).
  //
  // Send it on every page of the upward search, with the same instant.
  // Unlike `before`, it does not start a fresh search when a token comes
  // with it: token, have, limit, small_thumbnails and omit_thumbnails work
  // as on any page. That covers resuming a token the device no longer
  // holds and serving a page asked again. `have` counts only the photos
  // this upward search has brought, never those of the downward one. A
  // token from the other direction, or from another instant, counts as one
  // the device doesn't hold. Tags, people, collection and videos filter as
  // on any search. If `before` is also set, newer_than wins.
  //
  // Devices before #194 ignore it and answer an ordinary newest-first page
  // with oldest_first false. Drop that page, and don't ask that device
  // again until the next sign-in.
  google.protobuf.Timestamp newer_than = 11;
  // Places (the map in Images): only the photos taken inside this area,
  // by the position the device keeps for each (see GetPhotoPlaces) - a
  // place's area, to open its photos in the grid. Combines with tags,
  // people and collection as they combine with each other, and pages,
  // jumps (before, newer_than) and resumes like any search - send it on
  // every page, as they are; a photo without a position is never inside
  // one. Unset is the whole library. While Places is off nothing is inside
  // an area: the device keeps no positions.
  // Devices before Places ignore it and answer the whole library: offer
  // it only to a device that answered GetPhotoPlaces, never to one that
  // answered it with error_code "unknown_payload", nor while Places is off.
  PlaceArea area = 12;
  // Smart search (beta): the photos that best match this description, in
  // any of the apps' languages ("kids in the snow", "un perro en la
  // playa"), best first, within the other filters (tags, people,
  // collection, area: exact, as always) - a photo the device has no
  // embedding for yet isn't among them. Pages like a tag search (token,
  // have); before and newer_than don't apply. Send it only while
  // Settings.smart_search_enabled is on: off, the answer is error_code
  // "smart_search_off"; while the model is still downloading
  // (Settings.smart_search_model, release 152), "smart_search_downloading" -
  // the apps don't offer it then; on a device without the model,
  // "smart_search_unavailable". Devices before Smart search ignore it and
  // answer the whole library, so never send it to one whose Settings lack
  // smart_search_enabled. "" (or only spaces) is no text.
  string text = 13;
}

message ListOfFiles {
  repeated File files = 1;
  string token = 2;
  // Issue #192, set by ListFiles and SearchFiles: the device can keep
  // folders out of Images (devices before release 108 leave it false, and
  // the explorers then show no control), and whether the listed folder
  // itself is kept out (the explorers' banner; ListFiles only).
  bool out_of_images_supported = 3;
  bool folder_out_of_images = 4;
  // Release 113, set by GetThumbnails when it stopped short: the paths
  // asked for from this index (0-based) on were not looked at - the
  // answer reached its byte cap (about 8 MB) or the 48 paths a request
  // takes - so ask for them again. A path before it that isn't in the
  // answer has no thumbnail (not media, not processed yet, gone). 0 when
  // every path was looked at, and from devices before release 113, whose
  // answers can stop at the cap unsaid: a path left out may then only
  // have been cut, so don't remember it as having none.
  int32 ask_again_from = 5;
  // Issue #194, on a SearchPhotos answer: its photos are oldest first.
  // That is the answer to a request with newer_than, from a device that
  // honours it, on every page of it: the last one (token "") too, and an
  // empty one when nothing is newer. False on every other answer. Devices
  // before #194 ignore newer_than and always leave it false, so a page
  // asked for with newer_than that comes back without it is an ordinary
  // newest-first page and is to be dropped.
  bool oldest_first = 6;
  // Smart search: true on the pages of a text search while the device is
  // still describing photos it held before (just turned on, just updated):
  // some may be missing until it is done - ask again later.
  bool smart_search_reading = 7;
}

// Issue #77: per-month photo counts, used to size/position the gallery's
// date scrubber and to know how many placeholder squares to draw while
// dragging to a month that hasn't loaded yet. Same filter shape as
// SearchPhotos minus token/before - a scrubber query, not a page fetch.
message ReqPhotoDateBuckets {
  repeated string tags = 1;
  repeated string person_ids = 2;
  bool include_videos = 3;
  string group_id = 4; // issue #115, same meaning as SearchPhotos.group_id
  // Places: the same meaning as SearchPhotos.area, and the same rule for
  // devices before it.
  PlaceArea area = 5;
}

message PhotoDateBucket {
  string month = 1; // "2022-06"
  // Since #201 each photo counts once, in the month of its oldest copy:
  // the month SearchPhotos shows it in (see File.copies).
  int32 count = 2;
}

message RespPhotoDateBuckets {
  repeated PhotoDateBucket buckets = 1; // ordered desc, newest first
}

// Places: an area of the map, in degrees (WGS 84, as the photos' GPS
// tags). Bounds are inclusive. west may be greater than east: the area
// then crosses the antimeridian (180°), from west eastwards to east.
message PlaceArea {
  double south = 1;
  double west = 2;
  double north = 3;
  double east = 4;
}

// One map tile, numbered as every web map numbers them ("slippy map"
// tiles, Web Mercator): at zoom z the world is 2^z x 2^z tiles, x from
// the antimeridian eastwards and y from the north down, so a point is in
//   x = floor((lon + 180) / 360 * 2^z)
//   y = floor((1 - ln(tan(lat) + 1 / cos(lat)) / π) / 2 * 2^z)
// with lat in radians, clamped to ±85.0511287798° (the square map's edge),
// and lon 180 counted in the last column, 2^z - 1.
message PlaceTile {
  int32 x = 1;
  int32 y = 2;
}

// Places: the map in Images. The photos the device has a position for
// (from their GPS tags: the device reads them at upload, and once in the
// background for what it held before), grouped for the tiles a map shows
// at a zoom. Answers with PhotoPlaces. Owner and user sessions, as
// SearchPhotos; devices before Places answer error_code "unknown_payload".
// While Places is off (Settings.places_enabled) the device keeps no
// position and answers error_code "places_off": hide the map, as when
// Settings says it is off.
//
// Each tile is split into 4 x 4 cells (64 px of a 256 px tile), and each
// cell holding a photo is one place: the photos the same search would
// show (one per photo, whatever its copies; never what folders kept out of
// Images hold) whose position falls in that cell. A map asks for the tiles
// it shows, and for the next zoom's to have them before the zoom ends;
// an answer belongs to its zoom and tiles, so a client keeps places per
// (filters, zoom, x, y) until the library changes (it pulls to refresh,
// or the device restarts) and asks only for the tiles it lacks.
message GetPhotoPlaces {
  // 0 to 20; one outside is taken as the nearest of the two.
  int32 zoom = 1;
  // At most 64; the rest are left out of the answer. x is taken modulo
  // 2^zoom, so a map shown across the antimeridian can name the tiles past
  // it as it numbers them; a y outside 0 to 2^zoom - 1 is left out.
  repeated PlaceTile tiles = 2;
  // The same filters as SearchPhotos, with the same meaning: the places
  // hold the photos that search would show.
  repeated string tags = 3;
  repeated string person_ids = 4;
  bool include_videos = 5;
  string group_id = 6;
}

// One place of GetPhotoPlaces: the photos of one cell of a tile.
message PhotoPlace {
  // Where to draw it: the position of one of its photos, the one nearest
  // their mean on the map (the mean itself can be where none was taken:
  // Paris and Barcelona in one place at a low zoom).
  double latitude = 1;
  double longitude = 2;
  // How many photos it holds; never 0.
  int32 count = 3;
  // The smallest area holding them all (south and west their least
  // latitude and longitude, north and east the greatest; never across the
  // antimeridian): SearchPhotos.area with it shows exactly these photos,
  // when sent with the same filters.
  PlaceArea area = 4;
  // The tile it is in, at its zoom: x within 0 to 2^zoom - 1 (the modulo
  // GetPhotoPlaces takes), the key a client keeps it under.
  int32 zoom = 5;
  int32 x = 6;
  int32 y = 7;
  // The newest of its photos, by the date SearchPhotos sorts by (its
  // oldest copy's), at the path that search shows it at: hash, path, mime,
  // dates and size, no content. Its small thumbnail comes from
  // GetThumbnails, by path. Unset in the rare answer where it was deleted
  // since the device last read the library: the place still counts it
  // then, until the next answer.
  File cover = 8;
}

// The answer to GetPhotoPlaces.
message PhotoPlaces {
  // Every place of the tiles asked for, by tile then cell, in no order a
  // client should rely on.
  repeated PhotoPlace places = 1;
  // How many photos with a position match the filters, in the whole
  // library (not only the tiles asked for), and the smallest area holding
  // them all - to open a map framed on every photo. located_area is unset
  // when located_total is 0. Its west is greater than its east when the
  // photos are closer together across the antimeridian than around the
  // world the other way.
  int32 located_total = 2;
  PlaceArea located_area = 3;
  // The zoom the places are for (the one asked, within 0 to 20).
  int32 zoom = 4;
  // The device is still reading where the photos it held when Places was
  // turned on were taken: some are missing from the map for now, and come
  // as it reads them (ask again in a while). False once it has read them
  // all, and once a reading that couldn't read some has ended (those are
  // read again when the device restarts).
  bool reading = 5;
}

message File {
  string hash = 1;
  string mime = 2;
  google.protobuf.Timestamp created = 3;
  google.protobuf.Timestamp modified = 4;
  string path = 5;
  int32 size = 6;
  optional bytes content = 8;
  // Issue #132, filled by ListFiles: this entry is, or is inside, an
  // upload-only folder (see SetUploadOnly), and how many older versions
  // the file has (see ListFileVersions).
  bool upload_only = 9;
  int32 versions = 10;
  // Issue #187: the size in bytes, which the int32 `size` can't hold from
  // 2 GiB on. Devices before release 93 leave it 0, so readers use size64
  // when it is non-zero and fall back to size. `size` keeps carrying the
  // int64 wrapped to int32, as before, for apps that only know it.
  int64 size64 = 11;
  // Issue #192, filled by ListFiles and SearchFiles: this entry is, or is
  // inside, a folder kept out of Images (see SetOutOfImages).
  bool out_of_images = 12;
  // Release 113, on every entry of SearchPhotos and GetThumbnails answers:
  // true when its content is the small thumbnail (asked for with
  // small_thumbnails, and the device had it), false when it is the big
  // one (not asked for, or the device has no small one yet - it makes one
  // shortly). On an entry with content this is what counts, and what a
  // thumbnail is kept by. On a SearchPhotos entry without content
  // (omit_thumbnails) it only says a small one is stored (found by a
  // stat, not read): a client that keeps a big one in place of a small
  // one asks GetThumbnails for it again - once - when this turns true,
  // and keeps what that answer's entry says; if that is still the big one
  // (a small one stored but unreadable), it doesn't ask again.
  // Unset (optional: has/hasThumbnailSmall false) from devices before
  // release 113, which don't say: content asked for small is then the
  // small one or the big one (and from devices before 111 always the big
  // one) - keep it as asked for, or treat it as the big one and ask again
  // later.
  optional bool thumbnail_small = 13;
  // Issue #201, on the entries of a SearchPhotos answer (Images, People,
  // collections, the pickers). It counts the paths in Files that hold this
  // content, this entry's own included: every `files` row with its hash,
  // wherever it is, folders kept out of Images included. Older versions
  // kept in upload-only folders (file_versions, ListFileVersions) are not
  // paths and don't count.
  //
  // Since #201 an Images entry is one photo, not one path. It is the
  // photo's oldest copy (earliest created, then smallest path) among the
  // copies Images may show, so its path and created are that copy's.
  // Every path keeps its own stored date (Files shows them all), and the
  // date buckets, People and collections count the photo once.
  //
  // Above 1, deleting the photo from Images asks whether to delete only
  // this path or every copy (DelFile.every_copy, with DelFile.hash this
  // entry's hash). It is counted when the page is made, so a copy added or
  // removed since then isn't in it. Unset (optional: has/hasCopies false)
  // on every entry of a page whose count failed - the page is served
  // anyway, and such an entry offers no "every copy": delete only the
  // path -, on other answers, and from devices before #201, which list a
  // photo at its newest copy and don't honour every_copy, so delete only
  // the path.
  optional int32 copies = 14;
}

message Ack {
  bool ok = 1;
  string error_msg = 2;
  // Issue #56: a stable, machine-readable tag for the cases a client has
  // to *react* to rather than just print - currently the two the bridge
  // itself answers with when it can't hand a request to a device at all:
  // "device_unreachable" (registered domain, no live connection - see
  // cDeviceUnreachableMsg) and "account_disabled" (issue #93). Empty for
  // every other Ack, which stays exactly as it was.
  //
  // error_msg remains the thing to show a person; this only exists so a
  // client can tell these apart without matching on English prose that
  // three codebases would then have to keep in step.
  string code = 3;
  // Issue #117: set with code "too_many_attempts" - how long, in seconds,
  // until this address may try a password again. Shown by every client,
  // so the message can say when rather than just no.
  int32 retry_after_seconds = 4;
}

message GetTags {
}

message TagsList {
  repeated string tags = 1;
}

message ChangeKey {
  // RSA-OAEP(SHA-256) ciphertext, see Auth.key.
  bytes old_key = 1;
  bytes new_key = 2;
}

// Issue #108: optionally trims one of the videos being published, cutting
// it down to [start_secs, end_secs) before it's compressed and posted.
// The original file in the owner's library is never touched - only the
// copy that goes into the post, exactly like the size-driven compression
// in issue #60.
message VideoTrim {
  // Matches one entry in NewSocialPublication.paths.
  string path = 1;
  double start_secs = 2;
  // Exclusive end. Zero (or anything <= start) means "to the end of the
  // clip", so a caller that only wants to cut an intro can send just a
  // start.
  double end_secs = 3;
}

message NewSocialPublication {
  string text = 1;
  repeated string paths = 2;
  // Issue #108: at most one entry per path, and only for videos. Paths
  // with no entry here are published whole, so this is purely additive -
  // a client that knows nothing about trimming behaves exactly as before.
  repeated VideoTrim trims = 3;
}

message GetEvents {
  google.protobuf.Timestamp since = 1;
  int32 total = 2;
}

message GetSocialPublicationFiles {
  string uuid = 1;
}

// Issue #107: fetches the *full* bytes of one file in a publication -
// GetSocialPublicationFiles above only ever returns thumbnails, which is
// right for rendering a feed but leaves no way to actually play a video
// in it.
//
// Addressed by hash rather than path because a publication's files simply
// have no path: social_publications_files stores (pos, uuid, hash, mime,
// size), and the bytes live in unenc-storage-path keyed by that hash. The
// clients were asking GetFile for an empty path, which could never work -
// so a video in the timeline has never played on any platform.
//
// pub_uuid is not redundant: the device only serves a hash that actually
// belongs to that publication, which keeps this from becoming a
// read-any-file-by-hash oracle for anyone who can reach the feed.
message GetPublicationMedia {
  string pub_uuid = 1;
  string hash = 2;
}

// Issue #110: streaming instead of downloading a whole video before it
// can start playing. The client asks for a URL it can hand straight to a
// <video> element or AVPlayer, which then fetch it with ordinary HTTP
// range requests - the player starts on the first chunk and only ever
// pulls the parts it actually plays.
// Issue #180: a shared gallery - a set of photos and videos, copied and
// re-encrypted under a key of its own, opened by anyone with the link
// (https://<device>/shared#<uuid>.<secret>). The secret is never stored on
// the device: without the link nothing in the gallery can be read.

// What to share: exactly one of these.
message SharedGallerySource {
  repeated string paths = 1;   // these files
  string group_id = 2;         // an image group (issue #115)
  string directory = 3;        // the photos and videos under a folder
}

message PreviewSharedGallery {
  SharedGallerySource source = 1;
}

message SharedGalleryPreview {
  int32 files = 1;       // photos and videos that will be shared
  int64 bytes = 2;       // their total size (what the copy takes on disk)
  int32 skipped = 3;     // other files in the source, not shared
  int32 videos = 4;      // of files, how many are videos (left out of a low_res gallery)
}

message CreateSharedGallery {
  SharedGallerySource source = 1;
  string description = 2;
  int32 ttl_hours = 3;   // 0: the device's default ([otc] shared-link-ttl-hours)
  // Only small copies (the thumbnails, ~1000 px), photos only: the
  // originals never leave the library.
  bool low_res = 4;
}

message GetSharedGalleryJob {
  string job_id = 1;
}

// The copy runs in the background; the client polls with
// GetSharedGalleryJob until finished.
message SharedGalleryJob {
  string job_id = 1;
  int32 done = 2;
  int32 total = 3;
  int64 bytes_done = 4;
  int64 bytes_total = 5;
  bool finished = 6;
  string error = 7;      // set when finished and it failed
  string link = 8;       // set when finished and it worked; shown once, never stored
}

// Public: anyone with the link.
message OpenSharedGallery {
  string uuid = 1;
  string secret = 2;
}

message SharedGalleryItem {
  int32 index = 1;
  string name = 2;
  string mime = 3;
  int64 size = 4;
  google.protobuf.Timestamp taken = 5;
  bool has_preview = 6;  // a browser-ready JPEG exists (HEIC, RAW...)
}

message SharedGallery {
  string description = 1;
  google.protobuf.Timestamp created = 2;
  google.protobuf.Timestamp expires = 3;
  repeated SharedGalleryItem items = 4;
  bool low_res = 5;      // small copies only, not the originals
}

message GetSharedGalleryItem {
  enum Part {
    THUMBNAIL = 0;
    PREVIEW = 1;    // the browser-ready version (the original when it is one)
    ORIGINAL = 2;
  }
  string uuid = 1;
  string secret = 2;
  int32 index = 3;
  Part part = 4;
  int64 offset = 5;
  int32 length = 6;      // at most 4 MB
}

// A video of the gallery, streamed: answered with a RespMediaURL.
message GetSharedGalleryStream {
  string uuid = 1;
  string secret = 2;
  int32 index = 3;
}

// The owner's list of share links (Settings).
message ListSharedLinks {}

message SharedLinkInfo {
  string uuid = 1;
  string kind = 2;        // "gallery" or "archive" (a zip of files)
  string description = 3;
  google.protobuf.Timestamp created = 4;
  google.protobuf.Timestamp expires = 5;
  int32 opens = 6;
  google.protobuf.Timestamp last_opened = 7;  // unset if never opened
  int64 bytes = 8;        // what it takes on disk
  int32 files = 9;
}

message SharedLinks {
  repeated SharedLinkInfo links = 1;
}

message DeleteSharedLink {
  string uuid = 1;
}

message ReqGetMediaURL {
  // Exactly one of: a library path (the owner's own file), or a
  // publication's media, addressed the same way GetPublicationMedia does.
  string path = 1;
  string pub_uuid = 2;
  string hash = 3;
}

message RespMediaURL {
  // Empty when streaming this file wouldn't pay for itself - a small clip
  // arrives in one socket round trip, where streaming would cost an extra
  // one for this very call before a single byte moved. The client falls
  // back to fetching the whole thing, exactly as it did before.
  string url = 1;
  int64 total_size = 2;
  string mime = 3;
  int64 expires_at_unix_ms = 4;
}

// Issue #110: how the bridge serves a range of a device's media over the
// relay tunnel. Never called by a browser or app directly - they talk
// plain HTTP to /media/<token>, and the bridge translates. The token is
// the only credential: it was minted for one specific file, for one
// already-authenticated session, and expires (see mediatokens).
message ReqGetMediaRange {
  string token = 1;
  int64 offset = 2;
  int64 length = 3;
}

message RespMediaRange {
  bytes content = 1;
  int64 offset = 2;
  int64 total_size = 3;
  string mime = 4;
}

// Issue #94: updating the device in place from Settings.
message ReqCheckUpdate {}

message UpdateRelease {
  int32 version = 1;
  // Issue #183: "minor", "major" or "critical", and its "major.minor"
  // label (empty for releases from before labels, which show as builds).
  string kind = 3;
  string label = 4;
  // Named "summary" rather than "description": SwiftProtobuf renames a
  // field called description to description_p, because it would collide
  // with CustomStringConvertible - and every client would then be reading
  // an oddly-named field for no reason.
  string summary = 2;
}

message RespUpdateInfo {
  int32 current_version = 1;
  int32 latest_version = 2;
  // The releases this device has yet to apply, oldest first - what makes
  // the update incremental rather than a reinstall.
  repeated UpdateRelease pending = 3;
  // "idle", "running", "done", "failed" or "uptodate", plus whatever the
  // runner last reported. Survives the restart an update performs, since
  // the runner writes it to disk rather than holding it in memory.
  string state = 4;
  string message = 5;
  string last_updated = 6;
  // Set when the manifest itself couldn't be reached, which is different
  // from "no updates": one means try again later, the other means there
  // is nothing to do.
  string check_error = 7;
  // Issue #183: the installed version's label ("1.1"; empty before labels).
  string current_label = 8;
  string latest_label = 9;
  // The device runs from the container image (docker/, OTC_CONTAINER): it
  // can't update itself, its owner pulls the new image on the server, and
  // message says how. Clients show that message instead of the Update
  // button. Pending lists only releases whose image is already published.
  bool container = 10;
}

// Starts the update and answers immediately - it takes minutes and ends
// by restarting this very process, so there is nothing to wait for. Poll
// ReqCheckUpdate for progress.
message ReqApplyUpdate {}

// Settings > Restart device: the owner of the primary instance restarts
// the whole machine (systemctl reboot, run as root by otc-reboot.service -
// see scripts/device-runner/). Supervised per-user instances (issue #82)
// are refused. Answers RestartingDevice before the restart begins; the
// connection then drops and the apps reconnect once the device is back.
// A device before this release answers error_code "unknown_payload".
message RestartDevice {}

message RestartingDevice {
  // About how long the device is expected to be unreachable, in seconds.
  int32 expected_seconds = 1;
}

// Settings › Storage: erase a disk Status.mirror_candidates lists and add
// it to the mirror as its second disk; the mirror then copies every file
// onto it. The owner of the primary instance only: a user's instance gets
// an error without a code, a container dev.err.not_in_container, a demo
// device error_code "demo", devices before it "unknown_payload".
// Answers the generic Ack at once: ok once the request is handed to the
// root watcher (scripts/raid_watch.py), which checks everything again
// before it erases anything; the copy then shows in Status (raid_state
// RaidSyncing, raid_sync_percent), and an Alert says why when the watcher
// didn't use the disk. Refused before anything is asked - Ack ok false
// with code and error_msg, both also on the envelope (error_code,
// error_message): "not_candidate" (no such disk is offered now: unplugged,
// or already added), "not_degraded" (the mirror has both its disks, or a
// replacement is being copied onto), "busy" (another disk was just asked
// for and the watcher hasn't taken it yet).
message UseMirrorDisk {
  // MirrorDiskCandidate.id.
  string disk = 1;
}

// Issue #80: reaching the device over Tailscale Funnel instead of the
// bridge. Offered at first setup; see the limitations spelled out there.
message ReqSetupTailscale {
  // Optional. With a pre-shared auth key the whole setup is
  // non-interactive; without one, Tailscale needs a human to authorise
  // the node and the answer carries the URL to do that on. In the clear:
  // what clients sent before auth_key_sealed (still read when that is
  // empty).
  string auth_key = 1;
  // False turns Funnel back off. The node stays in the tailnet - leaving
  // that is the owner's business, not something this switch should
  // decide for them.
  bool enable = 2;
  // auth_key sealed with RSA-OAEP-SHA-256 under this connection's
  // GetPubKey key, as ChangeKey's keys are (issue #2): the bridge relays
  // this request. When set, auth_key is ignored.
  bytes auth_key_sealed = 3;
}

message ReqGetTailscaleStatus {}

// Issue #145: turning on the bridge after a setup that went without it.
// Owner-device only, like the Tailscale switch above. The flow: sign in to
// an Off The Cloud account (ReqBridgeSignIn, or a provider sign-in in the
// browser that comes back with a setup code), then ReqEnableBridge with a
// name - the device reserves it and restarts itself on the bridge.
message ReqGetBridgeAccess {}

message RespBridgeAccess {
  // The device is on the bridge (it has a bridge configured).
  bool enabled = 1;
  // Its address there, e.g. "cala.off-the.cloud"; empty when not enabled.
  string domain = 2;
  // The bridge a local-only device would join, e.g. "off-the.cloud".
  string bridge = 3;
  // A name is reserved and the device is restarting onto the bridge.
  bool pending = 4;
  // Why the last attempt to switch it on failed, if it did.
  string error = 5;
  // The account sign-ins the bridge offers besides email ("apple",
  // "google"), for the web app's buttons.
  repeated string providers = 6;
  // Issue #182: why a device is local-only after having been on the
  // bridge ("left": the owner switched it off; "released": the bridge no
  // longer knew its name - the account was deleted or the name given
  // back). Empty otherwise.
  string left_reason = 7;
  // The device's address on the home network ("192.168.1.20:8080"), for
  // a client to reach it by once it is local-only: .local names don't
  // resolve everywhere (Android). Empty when it can't be worked out.
  string local_address = 8;
}

// Issue #182: an owner's client asks the device to leave the bridge and
// work locally (at http://otc.local:8080), as if set up without it. The
// device gives its name back (BridgeReleaseDomain) and restarts local-only.
// Answers with RespBridgeAccess (pending while it restarts).
message ReqDisableBridge {}

// Either email + password, or a setup code (from the bridge's account
// page, or handed back by a provider sign-in). Answers with
// RespBridgeSignedIn.
message ReqBridgeSignIn {
  string email = 1;
  // In the clear: what clients sent before password_sealed (still read
  // when that is empty).
  string password = 2;
  string setup_code = 3;
  // The account password sealed with RSA-OAEP-SHA-256 under this
  // connection's GetPubKey key, as ChangeKey's keys are (issue #2): the
  // bridge relays this request. When set, password is ignored.
  bytes password_sealed = 4;
}

message RespBridgeSignedIn {
  // Short-lived; only good for ReqEnableBridge.
  string setup_token = 1;
  string email = 2;
}

// Answers with RespBridgeAccess (pending), then the device restarts.
message ReqEnableBridge {
  string name = 1;
  string setup_token = 2;
}

message RespTailscaleStatus {
  bool installed = 1;
  bool logged_in = 2;
  bool funnel_on = 3;
  // Where the device can be reached, once it can be.
  string public_url = 4;
  // Set when a human still has to authorise this node.
  string login_url = 5;
  string error = 6;
}

message GetSocialPublications {
  google.protobuf.Timestamp since = 1;
  int32 total = 2;
  repeated string exclude_uuids = 3;
}

message NewSocialComment {
  string pub_uuid = 1;
  string comment = 2;
  string publisher = 3;
}

message DelSocialComment {
  string comment_uuid = 1;
}

// issue #34: delete one of your own posts.
message DelSocialPublication {
  string pub_uuid = 1;
}

message DidSendFriendshipReq {
  string secret = 1;
  string domain = 2;
}

message Friendship {
  Profile origin_profile = 2;
  FriendShipStatus status = 3;
  bool sent = 4;
  string secret = 5;
  google.protobuf.Timestamp latest_sync = 6;
  // Issue #92: false until this friend's entire backlog of pre-existing
  // events has been fully replayed at least once (see social.go's
  // updateFriendEvents) - accepting a long-time-active friend otherwise
  // floods the owner with a notification for every historical like/
  // comment/post all at once. Real-time events from this point on notify
  // normally; the one-time backlog catch-up never does.
  bool notifications_started = 7;
  // Issue #174: this device asked the friend's device to delete what it
  // shared, and is waiting for that device to do it (then the friendship
  // goes). The friend's data is no longer synced in meanwhile.
  bool leaving = 8;
}

message Friendships {
  repeated Friendship friendships = 1;
}

message FriendshipsList {
}

message FriendshipRequest {
  string domain = 1;
}

message FriendshipInterRequest {
  string domain = 1;
  string secret = 2;
  Profile origin_profile = 3;
}

enum FriendShipStatus {
  Pending = 0;
  Accepted = 1;
  Blocked = 2;
}

message ChangeFriendStatus {
  string domain = 1;
  FriendShipStatus status = 2;
}

// Issue #25: the owner removes a friend request from their own device -
// one they sent (withdrawing it) or one they received (declining it).
// The device also asks the other side to drop its copy, best effort.
message DeleteFriendship {
  string domain = 1;
  // Issue #174: also remove from this device everything synced from that
  // friend - their posts and media, their comments and likes (on anyone's
  // posts), and alerts about them.
  bool delete_their_data = 2;
  // Issue #174: ask that friend's device to remove everything this device
  // shared there. Sent straight away when it answers; otherwise the
  // friendship stays, "leaving", until that device picks the request up
  // on its next sync, removes the data and drops the friendship.
  bool ask_them_to_delete_mine = 3;
}

// Issue #25: device-to-device counterpart of DeleteFriendship, sent by the
// deleting device so the other one drops its copy of the request too.
// Authenticated the way GetFriendshipStatus and DidSendFriendshipReq are:
// by the per-friendship secret only the two devices share.
message FriendshipInterDelete {
  string domain = 1; // the calling device's own domain
  string secret = 2;
  // Issue #174: remove everything the calling device shared here (its
  // posts, comments, likes) along with the friendship. Only ever the
  // caller's own data: the domain is the one the secret authenticates.
  bool forget_me = 3;
}

message LikePublication {
  string pub_uuid = 1;
}

message LikeComment {
  string comment_uuid = 1;
}

// issue #29: "who liked this" for a publication or a comment.
message GetPublicationLikers {
  string pub_uuid = 1;
}

message GetCommentLikers {
  string comment_uuid = 1;
}

message Likers {
  repeated Profile likers = 1;
}

enum ActionType {
  FriendshipReq = 0;
  LikePub = 1;
  LikeComm = 2;
  NewSocialComm = 3;
}

message GetSettings {
}

message SetSettings {
  string domain = 1;
}

message Settings {
  string domain = 1;
  // bridge_secret is the shared secret this device registers with the
  // bridge relay (see BridgeRegister below) — exposed so the setup section
  // can show/update it (issue #40) instead of it only ever being set
  // implicitly at first boot.
  string bridge_secret = 2;
  // face_recognition_enabled (issue #52) - off by default. Toggled via
  // SetFaceRecognitionEnabled below, not SetSettings: same reasoning as
  // SetBridgeSecret being its own request rather than a field bundled onto
  // SetSettings (see its own doc comment).
  bool face_recognition_enabled = 3;
  // Issue #153: how much space friends' posts may take, in MB (5120 by
  // default; the oldest are removed past it), and how much they take now.
  int32 social_storage_limit_mb = 4;
  int64 social_storage_used_bytes = 5;
  // Issue #181: tag photos and videos with what they show (on by default).
  // Toggled with SetImageTaggingEnabled.
  bool image_tagging_enabled = 6;
  // Localization: the language the user chose for every app, "" for
  // Automatic (each app follows its system language). Always set by devices
  // that know it; absent means the device predates localization.
  optional string language = 7;
  // Places, the map in Images: off unless the user turns it on
  // (SetPlacesEnabled), for their own library. Only while it is on does
  // the device keep where each photo and video was taken - read from its
  // GPS tags, kept unencrypted so the map opens quickly - and only then do
  // the apps show the map (GetPhotoPlaces answers error_code "places_off"
  // while it is off). The city and country search tags (issue #42) don't
  // depend on it. Always set by devices that have Places; absent means the
  // device predates it, and the apps show neither the map nor the switch.
  optional bool places_enabled = 8;
  // On this day (Memories): on unless the user turns it off
  // (SetMemoriesEnabled), for their own library. While it is on the device
  // measures how each photo looks (sharpness, exposure and a quality
  // model's score, kept as numbers by content) and GetMemories answers;
  // off, GetMemories answers error_code "memories_off" and nothing is
  // measured. Always set by devices that have it; absent means the device
  // predates it, and the apps show neither the memories nor the switch.
  optional bool memories_enabled = 9;
  // Smart search (beta): on by default since release 152 (off by default in
  // 151), each user turning it off or on again (SetSmartSearchEnabled) for
  // their own library. While it is on the
  // device describes each photo as a list of numbers (an embedding, from
  // the photo's thumbnail, by an image model on the device), kept encrypted
  // with the user's key, so SearchPhotos.text finds photos by what they
  // show; turning it off deletes them all. Always set by devices that have
  // it; absent means the device predates it, and the apps show neither the
  // switch nor the free-text search.
  optional bool smart_search_enabled = 10;
  // Smart search's model (since release 152 the device downloads it, about
  // 400 MB, only once Smart search is first turned on, at a capped speed,
  // instead of with every update). Always set by devices that have it, for
  // the user's own library; absent means an older device, which had the
  // model or answered "smart_search_unavailable".
  optional SmartSearchModel smart_search_model = 11;
  // How far the device is in describing the user's photos (release 152).
  // Set while Smart search is on and its model is ready; described equal to
  // total means done. Absent on older devices and while it is off or the
  // model isn't there yet.
  optional SmartSearchProgress smart_search_progress = 12;
}

// Smart search's work on the library (Settings.smart_search_progress).
message SmartSearchProgress {
  // Photos Images may show that have a description.
  int32 described = 1;
  // Photos Images may show: images outside the folders kept out of Images.
  int32 total = 2;
}

// Where Smart search's model is (Settings.smart_search_model). Neither ready
// nor downloading: not on the device yet, and nothing asked for it - the
// apps say turning it on downloads it.
message SmartSearchModel {
  // On the device: Smart search works.
  bool ready = 1;
  // Being downloaded, or waiting to try again (problem says why); asked for
  // by turning Smart search on, on this or another of the device's users.
  bool downloading = 2;
  // How far the download is, 0-100, while downloading.
  int32 percent = 3;
  // The last try failed, in the device's words in the request's language;
  // the device tries again by itself while Smart search is on. "" otherwise.
  string problem = 4;
}

// Chunked transfers: every file moves in pieces of at most 4 MB, so no
// message - and no device or bridge memory - ever holds a whole file.
//
// ReadFile answers with FileChunk: up to `length` bytes (max 4 MB) of the
// file's original content from `offset` (never converted: a HEIC stays a
// HEIC; GetFile is what converts, for showing a photo). `hash` reads an
// older version.
message ReadFile {
  string path = 1;
  string hash = 2;
  int64 offset = 3;
  int32 length = 4;
}

message FileChunk {
  string path = 1;
  string hash = 2;
  string mime = 3;
  // The whole file's size (not this chunk's).
  int64 size = 4;
  int64 offset = 5;
  bytes data = 6;
  google.protobuf.Timestamp created = 7;
  google.protobuf.Timestamp modified = 8;
}

// BeginUpload starts an upload of `size` bytes to `path` (answers with
// UploadStarted); the content follows in UploadChunk messages, in order
// (each answered with UploadProgress), and FinishUpload - with the
// content's SHA-256, checked - makes it the file (answers with File, like
// UploadFile). An upload untouched for 30 minutes is dropped.
message BeginUpload {
  string path = 1;
  int64 size = 2;
  google.protobuf.Timestamp created = 3;
  google.protobuf.Timestamp modified = 4;
  bool force_override = 5;
  string cloud_id = 6;
}

message UploadStarted {
  string upload_id = 1;
}

message UploadChunk {
  string upload_id = 1;
  // Must be the next byte the device expects (UploadProgress.received):
  // after a lost reply, a client resends from there.
  int64 offset = 2;
  bytes data = 3;
}

message UploadProgress {
  int64 received = 1;
}

message FinishUpload {
  string upload_id = 1;
  string sha256 = 2;
}

// Issue #153: sets Settings.social_storage_limit_mb; posts past a lowered
// limit are removed right away. Answers with the generic Ack.
message SetSocialStorageLimit {
  int32 mb = 1;
}

// SetFaceRecognitionEnabled (issue #52) is deliberately its own request,
// not a field on SetSettings - see Settings.face_recognition_enabled's doc
// comment. A photo uploaded while this is off is never processed for faces
// even after this is turned back on - see the `faces` table's own doc
// comment in db.sql for why that's a deliberate design choice, not a
// missing backfill feature.
message SetFaceRecognitionEnabled {
  bool enabled = 1;
}

// Places: turns the map in Images on or off for the user's own library
// (Settings.places_enabled). On, the device reads in the background where
// each photo and video it holds was taken, from its metadata
// (PhotoPlaces.reading until that is done), and keeps the position of
// every one it processes from then on. Off, it deletes every position it
// kept before it answers, and keeps none until it is turned on again.
// Answers with the generic Ack. Owner and user sessions, as
// SetFaceRecognitionEnabled; a demo device refuses it (error_code
// "demo"), and devices before Places answer error_code "unknown_payload".
message SetPlacesEnabled {
  bool enabled = 1;
}

// On this day (Memories): the photos taken around today in earlier years,
// the best of each year chosen by the device - who is in them (when face
// recognition is on), what they show, whether they were put in a
// collection or posted, a trip, and how they look - with screenshots,
// documents, blurred, badly exposed and tiny pictures left out, and a
// burst counted once. Answers with resp_memories; error_code
// "memories_off" while the user has it off (Settings.memories_enabled);
// devices before it answer error_code "unknown_payload". The answer for a
// date and period is kept by the device for the day, so ask again freely.
message GetMemories {
  // The client's own date, "YYYY-MM-DD": its today.
  string date = 1;
  MemoryPeriod period = 2;
  // The client's time zone, an IANA name ("Europe/Madrid"), so a photo
  // counts on the day it was taken there; "" (or one the device doesn't
  // know) uses utc_offset_minutes.
  string time_zone = 3;
  int32 utc_offset_minutes = 4;
}

// Which days a memory covers, in each earlier year.
enum MemoryPeriod {
  // The same day of the month (a 29 February shows on 28 February in the
  // other years).
  MemoryDay = 0;
  // The week around it: three days before to three days after.
  MemoryWeek = 1;
  // The same calendar month.
  MemoryMonth = 2;
}

// One earlier year's memory.
message Memory {
  // What HideMemory takes to hide this memory (kind MemoryHideMemory):
  // its period and first day, as "day:2023-10-30", "week:2023-10-27" or
  // "month:2023-10".
  string key = 1;
  // How many years ago (1 or more).
  int32 years_ago = 2;
  // The days it covers, "YYYY-MM-DD", first and last (the same for a day).
  string start_date = 3;
  string end_date = 4;
  // Where most of its photos were taken (a city, else a country, from the
  // photos' own location data); "" when none says.
  string place = 5;
  // The named people in its photos, the one in most first; empty while face
  // recognition is off.
  repeated string people = 6;
  // The photo to show it by, one of files: hash, path, mime, dates and
  // size, no content. Thumbnails come from GetThumbnails, by path.
  File cover = 7;
  // The photos chosen, in the order they were taken, as cover (8 to 12 at
  // most, fewer for a quiet day).
  repeated File files = 8;
  // How many photos Images holds for those days (screenshots and the like
  // included, what the user hid not): for "See all".
  int32 photo_count = 9;
}

// The answer to GetMemories.
message Memories {
  // One per earlier year that has photos worth showing, the most recent
  // first. Empty on a day with none.
  repeated Memory memories = 1;
  // The device is still measuring photos it held before On this day (just
  // updated, or just turned on): the choice may get better; ask again later.
  bool measuring = 2;
  // How many things the user has hidden (HideMemory), for "Show hidden
  // memories again".
  int32 hidden_count = 3;
}

// What HideMemory hides.
enum MemoryHideKind {
  // One photo, by content hash: never in a memory again.
  MemoryHidePhoto = 0;
  // Every photo taken on a day ("YYYY-MM-DD", in the client's time zone),
  // in any memory.
  MemoryHideDay = 1;
  // One memory, by Memory.key.
  MemoryHideMemory = 2;
  // Every photo with a person in it, by person id (face recognition).
  MemoryHidePerson = 3;
}

// On this day: hides something from the memories, or shows it again
// (show), or shows everything hidden again (show_all, kind and value
// ignored). Answers with the generic Ack. Owner and user sessions, each for
// their own library; a demo device refuses it (error_code "demo"), and
// devices before it answer error_code "unknown_payload".
message HideMemory {
  MemoryHideKind kind = 1;
  string value = 2;
  bool show = 3;
  bool show_all = 4;
}

// On this day's switch (Settings.memories_enabled), for the user's own
// library. Answers with the generic Ack. A demo device refuses it, and
// devices before it answer error_code "unknown_payload".
message SetMemoriesEnabled {
  bool enabled = 1;
}

// Smart search's switch (Settings.smart_search_enabled), for the user's own
// library. On: the device describes the photos it holds in the background,
// with this session's key - once its model is there: since release 152,
// turning it on where the model isn't starts its download
// (Settings.smart_search_model), and the photos are described after it;
// off: every description is deleted before the answer, and a download asked
// for by no other user stops. Answers with the generic Ack; error_code
// "smart_search_unavailable" (turning it on) on a device that can't get the
// model at all (and, before 152, on one without it). A demo device refuses
// it, and devices before it answer error_code "unknown_payload".
message SetSmartSearchEnabled {
  bool enabled = 1;
}

// SetImageTaggingEnabled (issue #181) turns the tagging model on or off
// for what is processed from now on. Answers with the generic Ack.
message SetImageTaggingEnabled {
  bool enabled = 1;
}

// Localization (docs/i18n.md): the user's language for every app. language
// is "" (Automatic) or a lowercase language code; the device stores it only
// while its current value equals `expected` (when set), so a change made
// meanwhile from another app is not overwritten. Owner sessions only.
// Answered with an Ack: ok, or ok=false with code "changed" (expected no
// longer matches) or "invalid_language"; a device that predates it answers
// unknown_payload.
message SetLanguage {
  string language = 1;
  optional string expected = 2;
}

// Person is one named (or not-yet-named) individual recognized across the
// library (issue #52). cover_thumbnail is one representative face crop (an
// aligned, already-small JPEG - see face_recognition.FaceDetection), enough
// to render a People list without a second round trip per entry.
message Person {
  string id = 1;
  string name = 2;
  int32 face_count = 3;
  bytes cover_thumbnail = 4;
}

message ListPeople {
}

message People {
  repeated Person people = 1;
}

// RenamePerson also *creates* the name for a still-unnamed (name == "")
// person - there's no separate "add a name" request, since from the
// server's point of view naming an unnamed person and renaming an already-
// named one are the exact same update.
message RenamePerson {
  string id = 1;
  string name = 2;
}

// DeletePerson removes this person and every face detection that was
// matched to them (issue #52: "just click on delete the individual") - see
// the `faces` table's own doc comment in db.sql. Not reversible: a face
// that reappears in a *future* photo gets clustered into a brand new
// person, same as if it had never been seen before.
message DeletePerson {
  string id = 1;
}

// MergePeople folds every source_ids person into target_id (issue #74) -
// for when the same individual got clustered into more than one Person
// (different angle/lighting missed face_recognition's same-person
// threshold). Every face detection belonging to a source person is
// reassigned to target_id and the source person rows are removed; target_
// id's own name/id are untouched, so pick whichever of the merged people
// already has the right name as the target. Not reversible - see
// DeletePerson's own doc comment on why an un-merge isn't a thing either
// (a future photo of that source identity just gets clustered fresh).
message MergePeople {
  string target_id = 1;
  repeated string source_ids = 2;
}

// RemoveFromPerson ("Not this person") takes photos off a person - the
// match only, never the photos. Every face matched to person_id in the
// photos named by hashes (files' content hashes, as in search results)
// leaves that person: with to_person_id set, they move to that person;
// left empty, they stay on record matched to no one, so face recognition
// neither files them under anyone again nor learns from them, and the
// photos are not analysed again. A Reprocess finds every face afresh, as
// it always did. An unnamed person left with no faces goes, as after a
// delete; a named one keeps their name. Hashes with no face of person_id
// are ignored, not an error. Answers with the generic Ack; a device from
// before it answers unknown_payload.
message RemoveFromPerson {
  string person_id = 1;
  repeated string hashes = 2;
  string to_person_id = 3;
}

// Issue #115: image groups (albums). cover_thumbnail is one member's
// thumbnail, chosen at random per listing, so the list can render with
// a picture per group without a round trip each - same idea as
// Person.cover_thumbnail.
message ImageGroup {
  string id = 1;
  string name = 2;
  int32 file_count = 3;
  bytes cover_thumbnail = 4;
}

message ListImageGroups {
  // cover_thumbnail is the cover's small thumbnail (see
  // GetThumbnails.small_thumbnails).
  bool small_thumbnails = 1;
}

message ImageGroups {
  repeated ImageGroup groups = 1;
}

// CreateImageGroup makes a group holding `paths` (which may be empty).
// Paths rather than hashes because that is what a selection holds on
// every client; the device resolves them. Answered with the new group.
message CreateImageGroup {
  string name = 1;
  repeated string paths = 2;
  // The answer's cover_thumbnail is the small one, as ListImageGroups'.
  bool small_thumbnails = 3;
}

message RespImageGroup {
  ImageGroup group = 1;
}

// AddToImageGroup adds `paths` to an existing group; already-members are
// ignored, not an error. Answered with the generic Ack.
message AddToImageGroup {
  string group_id = 1;
  repeated string paths = 2;
}

// RemoveFromImageGroup takes the photos at `paths` out of a group - the
// membership only, never the pictures themselves. A member is a photo, not
// a path (issue #201): taking out one copy takes the photo out. Paths that
// aren't members are ignored, not an error. Answered with the generic Ack;
// a device from before it answers unknown_payload, which the phones turn
// into "needs an update" with a button that starts it.
message RemoveFromImageGroup {
  string group_id = 1;
  repeated string paths = 2;
}

message RenameImageGroup {
  string id = 1;
  string name = 2;
}

// DeleteImageGroup removes the group and its membership rows only - never
// the pictures themselves. Answered with the generic Ack.
message DeleteImageGroup {
  string id = 1;
}

// StartReprocess kicks off issue #73's full-library reprocess: every
// image/video already uploaded gets its tags and faces recalculated from
// scratch (existing file_tags/faces/people are wiped first - see
// dao.WipeTagsAndFaces), run in the background using this connection's
// already-authenticated session. Answered with the generic Ack the moment
// the run starts (or resumes/no-ops - see files_manager.Reprocess), not
// when it finishes; poll GetReprocessStatus for progress. Calling this
// again while a run is already active in this process is a no-op, not an
// error - it just leaves the existing run going.
message StartReprocess {
  // Normally a previously stopped/interrupted run (status "running" or
  // "stopped") resumes from where it left off. force_restart says "no,
  // wipe everything and start over from the beginning anyway" - the
  // owner explicitly choosing a fresh run instead of continuing one
  // that's already partway done. Ignored while a run is actively active
  // in this process (cancel it first - see StopReprocess).
  bool force_restart = 1;
}

// GetReprocessStatus is polled (same pattern as GetStatus for RAID/disk)
// to drive the Settings screen's progress bar while a reprocess run is
// active - see ReprocessStatus.
message GetReprocessStatus {
}

message ReprocessStatus {
  // "idle" (never run), "running", "stopped" (cancelled - see
  // StopReprocess), "completed", or "failed".
  string status = 1;
  int32 total = 2;
  int32 processed = 3;
}

// StopReprocess cancels the active run, if any - a no-op otherwise.
// Answered with the generic Ack once the cancellation has been requested,
// not once the worker has actually wound down (it notices between files,
// see files_manager.CancelReprocess) - poll GetReprocessStatus to see
// status flip to "stopped". Stopping is not the same as it never having
// run: the next StartReprocess resumes from wherever this left off,
// exactly like recovering from an interrupted run.
message StopReprocess {
}

// SetBridgeSecret is deliberately its own request rather than a field on
// SetSettings: domain and bridge_secret used to be updated together (the
// secret was silently regenerated on every domain change), which broke a
// device's bridge pairing any time someone just wanted to rename their
// domain. They're independent settings now.
message SetBridgeSecret {
  string secret = 1;
}

// Issue #39/#38: first-run storage setup. Listing is safe/read-only (just
// /sys/block enumeration), but actually building the array is destructive
// (formats whichever disks are picked), so it's kept as an explicit,
// separate confirmation step rather than something that happens
// automatically just because a device was detected.
message ListStorageDevices {
}

message StorageDevice {
  // e.g. "/dev/sda" — this exact string is what SetupStorage expects back.
  string path = 1;
  int64 size_bytes = 2;
  string model = 3;
}

message StorageDevices {
  // Only devices safe to repurpose: the boot disk itself (and its
  // partitions), loop/ram devices, and anything with no usable size are
  // already filtered out server-side.
  repeated StorageDevice devices = 1;
}

// SetupStorage is destructive on anything selected: 2 devices creates a
// RAID1 mirror across them, 1 formats and uses that single device alone
// (no redundancy), 0 leaves storage on the boot disk as-is.
message SetupStorage {
  repeated string device_paths = 1;
}

// The Wi-Fi networks the device can see, for Settings > Wi-Fi's picker
// (issue #38 added it for the first-run step, since removed). Scanning is
// read-only (nmcli dev wifi list needs no special privilege), so it runs in
// the otc service itself. Owner of the primary instance; a child instance
// gets an error without a code, a container and a demo device an empty
// list. Answers WifiNetworks: one entry per name, the current network
// first, then by signal; names that aren't valid UTF-8 are left out.
message ListWifiNetworks {
}

message WifiNetwork {
  string ssid = 1;
  // 0-100, from nmcli's SIGNAL column (the strongest access point with
  // this name).
  int32 signal = 2;
  // From release 140: an access point with this name that the device can
  // join asks for a password (an open copy of a secured network's name
  // never makes it look open).
  bool secured = 3;
  // The network the device is on now. False on devices before release 140.
  bool current = 4;
  // A network the device can't join from Settings: every access point
  // with this name is 802.1X (enterprise), WEP or OWE. Shown greyed out.
  // False on devices before release 140.
  bool unsupported = 5;
}

message WifiNetworks {
  repeated WifiNetwork networks = 1;
}

// Retired in release 140: devices answer error_code "unknown_payload"
// (without logging the request); use JoinWifi. It carried the password in
// the clear. The fields stay so the number is never reused.
message SetWifi {
  string ssid = 1;
  string password = 2;
}

// Settings > Wi-Fi: the device's network now, and the last change asked
// from Settings. Answers WifiStatus. The owner of the primary instance gets
// managed=true when the device can change its own Wi-Fi; every other
// session, a child instance, a container (OTC_CONTAINER) and a device
// without NetworkManager, a wireless interface or the root runner get
// managed=false (not an error). A demo device answers managed=true,
// wired=true. Devices before release 140 answer error_code
// "unknown_payload": the apps hide the section until the next sign-in.
message GetWifiStatus {}

message WifiStatus {
  // The device changes its own Wi-Fi from Settings: Linux with
  // NetworkManager running (not netplan-backed), a wireless interface,
  // the root runner's otc-wifi-join.path active, and never in a container.
  bool managed = 1;
  // The Wi-Fi network it is on now; "" when not on Wi-Fi.
  string ssid = 2;
  // 0-100 (nmcli SIGNAL) for ssid; 0 when not on Wi-Fi.
  int32 signal = 3;
  // An Ethernet connection is up (NetworkManager: connected).
  bool wired = 4;
  // The last change asked from Settings: while it runs, and for 15
  // minutes after it ended. Absent otherwise (and after a reboot).
  WifiJoin last_join = 5;
}

message WifiJoin {
  // JoinWifi's answer carries it; the apps wait for this id to end.
  string id = 1;
  string ssid = 2;
  // "joining" | "connected" | "failed".
  string state = 3;
  // With joining: "joining". With connected: "connected". With failed:
  // wrong_password, auth_failed, not_found, timed_out, no_address,
  // no_internet, unsupported_security, password_required, open_network (a
  // password given, every access point with that name open), bad_request,
  // no_wifi, busy, update_running, too_many, interrupted, no_answer,
  // join_failed (also for any code this build doesn't know). Clients
  // branch on state/code and show message.
  string code = 4;
  // The same, in the request's language (dev.status.wifi_join.*, or with
  // failed the variant that says where the device ended up:
  // dev.status.wifi_join_back.* / dev.status.wifi_join_lost.*).
  string message = 5;
  // With failed: the device had left its previous Wi-Fi network for this
  // one and is back on it. False when it couldn't get back, and when it
  // never left (the failure came before it switched, or it had no Wi-Fi
  // network before) - message tells those apart.
  bool restored = 6;
}

// Joins a Wi-Fi network: a new one, or the same one with its new
// password. Hands off to the root runner (scripts/device-runner/
// otc-wifi-join-runner.py) and answers WifiStatus with last_join state
// "joining" at once; the connection may then drop for about a minute.
// The runner keeps the new network only once the device reaches the
// internet through it (the bridge when it has one, else its gateway), and
// otherwise goes back to the previous one. Refused (RespEnvelope.error
// with error_code) before anything changes: "not_managed", "bad_name",
// "bad_password", "busy", "update_running", "too_many"; "demo" on a demo
// device; "unknown_payload" before release 140. A child instance gets an
// error without a code, a container dev.err.not_in_container.
message JoinWifi {
  // 1-32 bytes of UTF-8, no control characters (below U+0020, U+007F).
  string ssid = 1;
  // RSA-OAEP(SHA-256) under this connection's GetPubKey key, like
  // ReqCreateUser.password. Empty for an open network. The plaintext is
  // 8-63 bytes of UTF-8 without control characters, or exactly 64
  // hexadecimal digits.
  bytes password = 2;
  // Typed by hand (a network that hides its name): joined even when the
  // scan doesn't show it.
  bool hidden = 3;
}

// Issue #43: push notifications when a friend posts. RegisterWebPush carries
// a browser PushSubscription's fields verbatim (endpoint + the two keys from
// subscription.toJSON().keys) so the device can send RFC8291-encrypted Web
// Push messages directly, no third-party push provider account needed.
message RegisterWebPush {
  string endpoint = 1;
  string p256dh = 2;
  string auth = 3;
}

// RegisterApnsToken registers this device's APNs token for real push
// delivery on iOS. Sending actually reaching the phone additionally needs
// this OTC device configured with an APNs Auth Key (see the [apns] config
// section) - registering the token here is safe/inert without one.
message RegisterApnsToken {
  string token = 1;
}

// Issue #131: the reverse of the two registrations above, sent best effort
// by Log Out (iOS) and Sign Out (web) before the phone or browser forgets
// the device, so the device - and through it the bridge - stops pushing to
// a client that is no longer signed in to it. Answers with the generic Ack;
// unregistering something the device never had is not an error.
message UnregisterApnsToken {
  string token = 1;
}

// Issue #125: the Android counterparts of the two above - the app's
// Firebase Cloud Messaging registration token. Both answer with the
// generic Ack. The bridge holds the Firebase key and does the sending.
message RegisterFcmToken {
  string token = 1;
}

message UnregisterFcmToken {
  string token = 1;
}

message UnregisterWebPush {
  string endpoint = 1;
}

message GetVapidPublicKey {
}

// The device generates its own VAPID keypair on first use (see push.Init) -
// no external account needed, unlike APNs. This is the public half, base64url
// encoded, ready to pass as PushManager.subscribe's applicationServerKey.
message VapidPublicKey {
  string key = 1;
}

message BridgeRegister {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
}

enum BridgeOnboardErrorType {
  generic_error = 0;
  taken_domain = 1;
  secret_missmatch = 2;
  unknown_owner = 3;
  pending_approval = 4;
}

message BridgeAckOnboard {
  bool ok = 1;
}

// BridgeClientInfo (issue #117) is the first thing the bridge sends down a
// relay connection once it has paired it with a client: the client's own
// address, which the device otherwise never sees - every relayed request
// arrives from the bridge's IP. The device keeps it for the life of that
// relay (one relay serves one client for its whole session) and rate-limits
// password attempts by it. Only honoured on connections the device itself
// dialled out to the bridge; a client connected directly to the device
// cannot send this to choose its own address.
message BridgeClientInfo {
  string remote_addr = 1;
}

// RotateBridgeSecret lets a device that already knows its current secret
// get a fresh one issued, without an admin manually deleting and re-adding
// its domain on the bridge's admin panel. Sent bridge-side (not on the
// device's own client-facing /ws) — `secret` is the CURRENT secret, and is
// the only thing that authenticates this request: the bridge only replaces
// it if this matches what it already has on record for owner_uuid+domain,
// same compare-and-swap spirit as BridgeRegister's existing secret check.
message RotateBridgeSecret {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
}

// Issue #182: sent by a device to the bridge, authenticated like
// RotateBridgeSecret by its current secret: the bridge deletes the
// device's domain (held for its account for 30 days, like a release from
// the account page) and forgets its push registrations. Answers with Ack.
message BridgeReleaseDomain {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
}

message RotateBridgeSecretAck {
  string new_secret = 1;
}

// Issue #93: sent by the primary instance to the bridge whenever it
// disables/re-enables one of its own additional users (issue #90) - that
// user's own process is actually stopped when disabled, so nothing on the
// device itself is left running to explain why a visitor to its subdomain
// suddenly can't reach anything. The bridge records this against the
// domain (see bridge/dao's own devices table) so it can show a clear
// "this account has been disabled" message instead of a generic
// connection failure, whether or not that user's process ever manages to
// reconnect. owner_uuid/domain/secret identify the *user being disabled*,
// not the primary sending this - the same identity that user's own
// process would use to register with the bridge itself. Answers with the
// generic Ack.
message ReqSetDeviceDisabled {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  bool disabled = 4;
}

// RegenerateBridgeSecret is the client-facing (device /ws, authenticated)
// request behind the Settings page's "Regenerate" button: the device looks
// up its own owner_uuid/domain/current secret and does the
// RotateBridgeSecret round trip to the bridge itself, then persists and
// returns the new secret — the web app never talks to the bridge directly.
message RegenerateBridgeSecret {
}

// Issue #62: the bridge is the only party still online when a device goes
// unreachable, so it has to be the one sending the "you're offline" alert —
// which means it needs its own copy of whatever this device would otherwise
// use to push-notify its own owner. Sent bridge-side (like
// BridgeRegister/RotateBridgeSecret above, not on the device's own
// client-facing /ws), and always the device's *current full* set of
// registrations, replacing whatever the bridge had stored for this domain
// before — simpler and self-healing (a bridge DB reset just looks like
// every device re-syncing on its next registration change) than trying to
// keep two independently-diffed copies in sync over time.
message UpdatePushRegistrations {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  repeated string apns_tokens = 4;
  repeated WebPushSub web_push_subs = 5;
  // Web Push payloads are signed with the VAPID key the browser's
  // subscription was originally created against - the bridge sending on
  // this device's behalf has to sign with the exact same keypair this
  // device already generated for itself (see push.Init), not one of its
  // own, or every send would be rejected as a signature mismatch.
  string vapid_public_key = 6;
  string vapid_private_key = 7;
  // Issue #125: the Android app instances, sent through FCM.
  repeated string fcm_tokens = 8;
  // Localization: the language the bridge writes its own push in (the
  // user's stored choice, else the app that last registered), "" for English.
  string language = 9;
}

message WebPushSub {
  string endpoint = 1;
  string p256dh = 2;
  string auth = 3;
}

message UpdatePushRegistrationsAck {
  bool ok = 1;
}

// BridgeNotify asks the bridge to deliver an iOS push on this device's
// behalf. The APNs auth key is the developer *team's* private key - whoever
// holds it can notify every install of the app - so it lives on the bridge
// alone and no device ever sees it. Note what this message does not carry:
// tokens. The bridge sends to the APNs tokens it holds for the
// authenticated domain (those this very device registered via
// UpdatePushRegistrations), so a device cannot address anyone else's
// phones by construction, not by a check. Web Push is not relayed: its
// VAPID keypair is the device's own, so the device keeps sending that
// itself. title/body are the same minimal text as ever - a friend's name
// and an action, never post content.
message BridgeNotify {
  string owner_uuid = 1;
  string domain = 2;
  string secret = 3;
  string title = 4;
  string body = 5;
  // What a tap opens in the apps (push.Target): kind "post" or "friends",
  // and the post/comment - IDs only, never content.
  string kind = 6;
  string pub_uuid = 7;
  string comment_uuid = 8;
}

message BridgeNotifyAck {
  bool ok = 1;
}

message GetProfile {
}

message Profile {
  string name = 1;
  optional bytes image = 2;
  string text = 3;
  string domain = 4;
}

message ShareFilesLink {
  repeated string paths = 1;
}

message ShareLink {
  string link = 1;
}

message DownloadSharedLink {
  string uuid = 1;
  string secret = 2;
  // Chunked: with a length (at most 4 MB) the answer is a FileChunk of the
  // archive from offset (size = the whole archive's); without one, the
  // whole archive as SharedFiles (being phased out).
  int64 offset = 3;
  int32 length = 4;
}

message NewSocial {
  string uuid = 1;
}

message SharedFiles {
  bytes content = 1;
}

message Comment {
  string pub_uuid = 1;
  string comment_uuid = 2;
  string comment = 3;
  string publisher = 4;
  int32 likes = 5;
  google.protobuf.Timestamp date_time = 6;
  // liked reports whether the requesting viewer already liked this
  // comment, so clients can render a filled vs. outline heart.
  bool liked = 7;
  // Issue #174: written by this device's owner - who may delete it, on
  // anyone's post (friends apply the deletion because it's theirs).
  bool own = 8;
}

message SocialPublication {
  string uuid = 1;
  string text = 2;
  repeated File files = 3;
  repeated Comment comments = 4;
  int32 likes = 5;
  Profile publisher = 7;
  // liked reports whether the requesting viewer already liked this
  // publication, so clients can render a filled vs. outline heart.
  bool liked = 8;
  // own reports whether this is one of the device owner's own posts, so
  // clients know when to offer delete-post / delete-any-comment actions
  // (issues #34/#35).
  bool own = 9;
  // date_time is when the post was published, so clients can show it in
  // the feed (same field shape as Comment.date_time above).
  google.protobuf.Timestamp date_time = 10;
}

message SocialPublicationFiles {
  repeated File files = 1;
}

// FileExifInfo is a photo/video's camera/EXIF metadata, computed on demand
// from the file's own bytes (never stored) for the photo gallery's "More
// info" panel (issue #41). city/country are filled in from latitude/
// longitude via an offline reverse-geocode (see geotag/) whenever has_gps
// is true, the same lookup issue #42 uses to add them as searchable tags.
message FileExifInfo {
  string camera_make = 1;
  string camera_model = 2;
  google.protobuf.Timestamp taken_at = 3;
  string exposure_time = 4;
  string f_number = 5;
  int32 iso = 6;
  string focal_length = 7;
  int32 width = 8;
  int32 height = 9;
  bool has_gps = 10;
  double latitude = 11;
  double longitude = 12;
  string city = 13;
  string country = 14;
}

message GetFileInfo {
  string path = 1;
}

message SocialPublications {
  repeated SocialPublication publications = 1;
  google.protobuf.Timestamp since = 2;
}

message Event {
  string uuid = 1;
  google.protobuf.Timestamp dt = 2;
  string type = 3;
  string content = 4;
}

message Events {
  repeated Event events = 1;
  google.protobuf.Timestamp since = 2;
}

// Issue #78: the owner-facing notification timeline (bell icon) - distinct
// from Event/Events above, which is an outbound write-log friends pull
// from to sync their own cached copy of this device's activity, not
// something the owner reads directly. This device has exactly one owner
// (see Profile), so there's no recipient to filter by - every row here is
// already "for" the one person who'll ever see it. Deliberately excludes
// "a friend posted something new" - Instagram's own activity tab treats
// that as ordinary feed content too, not a notification.
enum NotificationType {
  NotificationLikePublication = 0;
  NotificationLikeComment = 1;
  NotificationNewComment = 2;
  NotificationFriendRequest = 3;
  NotificationFriendAccepted = 4;
  // Issue #64: something went wrong on the device outside any request - a
  // photo that could not be processed, a file that never made it to disk.
  // Grouped: errors within five minutes of the first share one
  // notification (see dao.AddErrorNotification), so the list is never
  // flooded. actor fields are unused; title/details/occurrences carry it.
  NotificationError = 5;
  // Issue #183: a major or critical update is available - title says which
  // version, details what it changes; opens Settings.
  NotificationUpdate = 6;
}

message Notification {
  string uuid = 1;
  google.protobuf.Timestamp dt = 2;
  NotificationType type = 3;
  string actor_name = 4;
  string actor_domain = 5;
  // pub_uuid is set for LikePublication/NewComment/LikeComment - even
  // LikeComment's own comment_uuid resolves to a pub_uuid (dao.
  // GetCommentPubUuid), so a click can always land on "the post" no
  // matter which of the three it is. Unset for FriendRequest/
  // FriendAccepted.
  string pub_uuid = 6;
  // comment_uuid is set only for LikeComment/NewComment, to additionally
  // scroll to/highlight the specific comment once the post is open.
  string comment_uuid = 7;
  bool acknowledged = 8;
  // actor_image is the acting friend's cached avatar (social_friendship.
  // image), shown at the left of the row - unset if that friend has no
  // avatar cached.
  optional bytes actor_image = 9;
  // thumbnail is a small preview of the post/comment this notification
  // points to (pub_uuid's first file), shown at the right of the row -
  // unset for FriendRequest/FriendAccepted, which point at no post.
  optional bytes thumbnail = 10;
  // Issue #64, NotificationError only: the one line shown in the list (the
  // first error's), every error's line in arrival order (shown on hover or
  // tap), and how many errors the row stands for.
  string title = 11;
  string details = 12;
  int32 occurrences = 13;
}

message ReqListNotifications {
  int32 limit = 1;
}

message RespNotifications {
  repeated Notification notifications = 1;
}

message ReqGetNotificationCount {
}

message RespNotificationCount {
  int32 unacknowledged_count = 1;
}

// Answers with the generic Ack.
message ReqMarkNotificationsAcknowledged {
}

// A single-post fetch, new for issue #78: tapping a notification for a
// post that isn't among whatever page of the feed happens to be loaded
// needs to be able to pull just that one post to open/scroll to.
message ReqGetPublication {
  string pub_uuid = 1;
}

message RespPublication {
  SocialPublication publication = 1;
}

// Issue #82: multiple OTC "users" on one device, each a fully separate
// process/port/database/storage-directory, managed from the PRIMARY
// instance's Settings screen only (see ReqGetInstanceRole) - see
// supervisor/supervisor.go's doc comment for the full design. Issue #89:
// there is deliberately no is_admin/promote concept here - the original
// device owner (whoever is logged into the primary instance) is the only
// admin there will ever be; every other user is just a user.
message User {
  string uuid = 1;
  string username = 2;
  int32 port = 3;
  string subdomain = 4;
  // 5 was is_admin (issue #82) - removed by issue #89, left unused
  // rather than renumbering active/created after it.
  bool active = 6;
  google.protobuf.Timestamp created = 7;
  // Issue #103: false for a local-only user (one created without
  // requesting bridge access) - it has no registration on the bridge and
  // is reachable only on this machine's own network.
  bool bridge_access = 8;
}

message ReqListUsers {}

message RespUsers {
  repeated User users = 1;
  // The answer to a CreateUser only: whether the device stored the
  // password sent with it (ReqCreateUser.password). A device that knows
  // the field always sets it there; an older one leaves it unset, having
  // ignored the password, so the account's first sign-in sets it.
  optional bool password_set = 2;
}

// port is optional - omit it (0) to let the primary pick the next free
// one itself.
message ReqCreateUser {
  string username = 1;
  int32 port = 2;
  // Issue #103: whether this user should be reachable from outside the
  // house, i.e. registered on the bridge as <username>.<bridge-addr>.
  // When set, the device asks the bridge whether that subdomain is free
  // *before* provisioning anything (see ReqIsDomainAvailable) and refuses
  // to create the user if it isn't - a subdomain already claimed by some
  // other registration can never be claimed by this one, so creating the
  // user anyway produces an account that looks fine in the panel and is
  // silently unreachable forever, with the only evidence buried in that
  // user's own log ("bridge rejected registration: Invalid Secret").
  // Hit exactly that way on a live device before this existed.
  bool request_bridge_access = 3;
  // The account's first password: RSA-OAEP(SHA-256) ciphertext, like
  // Auth.key, under this connection's GetPubKey key. The device stores it
  // before the account's instance starts, so nobody can sign in first and
  // claim the account; its person changes it later in Settings > Change
  // Password. Empty: the account's first sign-in sets it, as before.
  bytes password = 4;
}

// confirm_username must match username exactly - checked server-side too,
// never trusted from the client alone, since this deletes a whole
// database and storage directory.
message ReqDeleteUser {
  string uuid = 1;
  string confirm_username = 2;
}

// Issue #90: enable/disable a user's access without deleting their
// database or storage - unlike ReqDeleteUser this is fully reversible.
// Disabling actually stops that user's running process immediately
// (supervisor.Stop), not just a flag flip that only takes effect next
// time it happens to restart; enabling spawns it again right away.
// Answers with the generic Ack.
message ReqSetUserActive {
  string uuid = 1;
  bool active = 2;
}

message ReqGetUserMetrics {
  string uuid = 1;
}

message RespUserMetrics {
  double storage_mb = 1;
  double storage_pct = 2;
  int32 active_connections = 3;
}

// Lets a Settings screen know whether it's talking to the primary
// instance (and should render the Users section) or one of the spawned
// per-user instances (which never expose user management, even if a
// request reaches it directly - see websocket.go's guard on every other
// RPC above).
message ReqGetInstanceRole {}

message RespInstanceRole {
  bool is_primary = 1;
}

message GetFriendshipStatus {
  string domain = 1;
  string secret = 2;
}

// FriendshipStatusReply, not FriendshipStatus: that name differs from the
// enum FriendShipStatus only by case, and the Java/Kotlin generators put
// each type in its own file (and class file), which collide on a
// case-insensitive filesystem - macOS, where the Android app is built.
message FriendshipStatusReply {
  FriendShipStatus status = 1;
  // Issue #25: true when the asked-about device holds no friendship for
  // that domain+secret at all - which, for a sender still holding a
  // pending request, means the receiver deleted it. Distinct from an error
  // so a network or database problem never reads as "they declined".
  bool not_found = 2;
}

message AuthAsFriend {
  string domain = 1;
  string secret = 2;
}

// Issue #95: the bridge fetches a device's static web assets (the SPA
// bundle, index.html, favicons, etc.) through this RPC now, over the same
// tunnel every other request already uses, instead of keeping its own
// separate copy that had to be redeployed by hand every time a device's
// own build changed. path is a URL path exactly as a browser requested it
// (e.g. "/assets/index-abc123.js", "/", "/social") - the device resolves
// it the same way its own HTTP static handler does (see
// staticassets.Resolve), and only ever answers with a file that already
// exists inside its own static assets directory: nothing else on the
// device is reachable through this, regardless of what path asks for.
message ReqGetStaticAsset {
  string path = 1;
}

message RespStaticAsset {
  bytes content = 1;
  string content_type = 2;
}

// Issue #190: how an app reaches the device on the home network instead of
// through the bridge. Owner sessions only, asked after signing in through
// the bridge; answers with LocalEndpoint. A device before this release
// answers error_code "unknown_payload", and one that can't be reached that
// way (no TLS listener, no home-network address) "local_unavailable":
// either way the app forgets what it stored and stays on the bridge.
message GetLocalEndpoint {}

message LocalEndpoint {
  // The device's private IPv4 and IPv6 ULA addresses, bare (an IPv6 one
  // goes in brackets in a URL): wss://<address>:<port>/ws, and media at
  // https://<address>:<port>/media/<token>.
  repeated string addresses = 1;
  int32 port = 2;
  // SHA-256 of the DER bytes of the device's self-signed certificate: the
  // only certificate an app accepts on these addresses, whatever its name
  // or issuer, checked before anything is sent.
  bytes cert_sha256 = 3;
}

message ReqEnvelope {
  int32 id = 1;
  // Localization (docs/i18n.md): the app's effective language code ("es"),
  // set on every request after its build closure. The device writes its
  // replies in it; a request without it (apps released before this, friend
  // devices, the bridge) gets the English text exactly as before.
  string lang = 2;
  oneof payload {
    ListFiles req_list_files = 10;
    GetStatus req_get_status = 11;
    Auth req_auth = 12;
