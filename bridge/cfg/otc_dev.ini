[logger]
level=debug
log_file=/var/log/otc_bridge.log
max_log_size_mb=10

[otc-api]
static=/var/www
port=80
ssl-port=443
ssl-cert=
ssl-key=

[admin]
# Signs admin panel session cookies. Generate one per deployment and keep
# it stable across restarts (e.g. `openssl rand -hex 32`), otherwise every
# restart logs every admin out. Required section - the process refuses to
# start if [admin] itself is missing, even with this key left empty.
session-secret=

# Optional (issue #53 follow-up) - caps how many idle pooled connections a
# single device is allowed to accumulate here. Each device now grows its
# own side of the pool dynamically under load instead of dialing a fixed
# count once (see websocket.ensureBridgePool on the device side); this is
# the backstop against that growing unbounded. Omit this whole section and
# it defaults to 100.
[bridge]
max-connections-per-device=100

# Issue #124: user accounts (https://<tld>/account). open-registration
# keeps the pre-accounts rule where an unknown device dialling in registers
# its domain with no account behind it - on here for development, leave it
# off in production. The providers are optional: a provider whose
# credentials are missing is simply not offered on the account page.
# Google: an OAuth client (web application) in the Google Cloud console
# with https://<tld>/account/auth/google/callback as a redirect URI.
# Apple: a Services ID with Sign in with Apple enabled, the same callback
# as the return URL, and a Sign in with Apple key (.p8) from the team.
[accounts]
open-registration=true
google-client-id=
google-client-secret=
apple-client-id=
apple-team-id=
apple-key-id=
apple-private-key=
