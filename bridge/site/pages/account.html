<!DOCTYPE html>
<html lang="{{.Tag}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{t "site.account.meta.title"}}</title>
  <meta name="description" content="{{t "site.account.meta.description"}}" />
  <link rel="canonical" href="{{.Canonical}}">
  {{- range .Alternates}}
  <link rel="alternate" hreflang="{{.Lang}}" href="{{.Href}}">
  {{- end}}
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style nonce="{{.Nonce}}">
    :root{
      --ink:#10231f; --ink-2:#0b1815; --ember:#ff6b4a; --gold:#ffc857; --mist:#eaf2ef; --mist-dim:#b9c9c4;
      --line:rgba(234,242,239,.12); --panel:rgba(234,242,239,.05); --panel-solid:#132a25; --ok:#7fd1a5; --bad:#f28b82;
    }
    *{box-sizing:border-box}
    body{margin:0;font:16px/1.55 'Manrope',system-ui,-apple-system,sans-serif;color:var(--mist);background:var(--ink)}
    a{color:var(--gold)}
    header{border-bottom:1px solid var(--line);background:var(--ink-2)}
    .nav{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;color:var(--mist);text-decoration:none;font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px}
    .brand img{width:32px;height:32px;border-radius:8px}
    .nav .who{color:var(--mist-dim);font-size:14px;display:flex;gap:14px;align-items:center}
    main{max-width:960px;margin:0 auto;padding:28px 20px 60px}
    h1{font-family:'Unbounded',sans-serif;font-size:1.5rem;margin:0 0 6px;letter-spacing:-.01em}
    h2{font-family:'Unbounded',sans-serif;font-size:1.05rem;margin:0 0 10px}
    p.lead{color:var(--mist-dim);margin:0 0 22px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media (max-width:760px){.grid{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
    .card.wide{grid-column:1 / -1}
    label{display:block;font-size:13px;color:var(--mist-dim);margin:12px 0 4px}
    input,select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink-2);color:var(--mist)}
    input:focus,select:focus{outline:2px solid var(--ember);border-color:transparent}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .row > *{flex:1}
    .btn{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid transparent;background:var(--ember);color:var(--ink-2);cursor:pointer;margin-top:14px}
    .btn.ghost{background:transparent;color:var(--mist);border-color:var(--line)}
    .btn.danger{background:transparent;color:var(--bad);border-color:rgba(242,139,130,.5)}
    .btn.small{padding:6px 12px;font-size:13px;margin-top:0;flex:none}
    .btn:disabled{opacity:.5;cursor:default}
    .msg{margin-top:10px;font-size:14px;min-height:1.2em}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
    .hint{color:var(--mist-dim);font-size:14px;margin:0 0 8px}
    .providers{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .providers a{flex:1;text-align:center;text-decoration:none;color:var(--mist);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
    .providers a:hover{border-color:var(--gold)}
    .terms{font-size:13px;color:var(--mist-dim);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
    .terms b{color:var(--mist)}
    .check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px}
    .check input{width:auto;margin-top:3px}
    ul.domains{list-style:none;margin:0;padding:0}
    ul.domains li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
    ul.domains li:first-child{border-top:0}
    .dom{font-family:'JetBrains Mono',monospace;font-size:15px;flex:1;min-width:200px}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mist-dim);margin-right:8px;vertical-align:1px}
    .dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
    small{color:var(--mist-dim)}
    .code{font-family:'JetBrains Mono',monospace;font-size:2rem;letter-spacing:.18em;text-align:center;padding:16px;border:1px dashed var(--gold);border-radius:12px;margin:12px 0 6px;user-select:all}
    .secret{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-all;user-select:all;margin-top:10px}
    .banner{border:1px solid rgba(242,139,130,.5);color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:18px}
    .muted{color:var(--mist-dim)}
    /* What were style attributes, which the page's Content-Security-Policy
       refuses: each selector outranks the rule it overrides, as the
       attribute did. */
    .hint.mt10{margin-top:10px}
    .hint.mt12{margin-top:12px}
    .hint.mt16{margin-top:16px}
    .hint.foot{margin-top:32px}
    .card.narrow{max-width:520px}
    .card.gold{border-color:var(--gold)}
    .row > .fixed{flex:none}
    .banner.ok{color:var(--ok);border-color:rgba(127,209,165,.5)}
    .lang-switch{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
    .lang-switch a[aria-current]{color:var(--mist);text-decoration:none}
  </style>
</head>
<body>

    <div class="nav">
      <a class="brand" href="{{.Home}}">
        <img src="/logo.png" alt="" width="32" height="32">
        Off The Cloud
      </a>
      <div class="who" id="who"></div>
    </div>
  </header>
  <main>
    <div id="banner"></div>
    <div id="view"><p class="hint">{{t "site.account.loading"}}</p></div>
    <p class="hint foot"><a href="/privacy">{{t "site.account.footer.privacy"}}</a> · <a href="{{.Home}}">Off The Cloud</a></p>
    {{- if .Switcher}}
    <nav class="lang-switch" aria-label="{{t "site.common.language"}}">
      {{- range .Switcher}}
      <a href="{{.Href}}" lang="{{.Lang}}" hreflang="{{.Lang}}"{{if .Current}} aria-current="page"{{end}}>{{.Name}}</a>
      {{- end}}
    </nav>
    {{- end}}

  <!-- What the page says for each error code (docs/i18n.md), in its
       language: "api" for the {code, error} answers of bridge/accounts and
       bridge/api - the API's own words for the code (api.error.*), or the
       page's where it words a code its own way - with the terms' figures
       filled in by the script (fillIn); "signin" for the ?error= a Google
       or Apple sign-in comes back with (oidc.go's cSignIn* codes). Data
       only, read with JSON.parse. errorcodes_test.go keeps it in step with
       the Go side. -->
  <script type="application/json" id="error-text">{"api":{{jstexts
    "invalid_body" "api.error.invalid_body"
    "not_signed_in" "api.error.not_signed_in"
    "signin_check_unavailable" "api.error.signin_check_unavailable"
    "cross_origin" "api.error.cross_origin"

    "wrong_password" "api.error.wrong_password"
    "recent_signin_required" "site.account.error.recent_signin_required"
    "account_check_unavailable" "api.error.account_check_unavailable"

    "delete_unavailable" "api.error.delete_unavailable"
    "too_many_emails" "api.error.too_many_emails"
    "email_send_unavailable" "api.error.email_send_unavailable_email"
    "verify_unavailable" "api.error.verify_unavailable"
    "verify_link_invalid" "api.error.verify_link_invalid"
    "reset_unavailable" "api.error.reset_unavailable"
    "reset_link_invalid" "api.error.reset_link_invalid"
    "email_not_verified" "api.error.email_not_verified"
    "terms_not_accepted" "api.error.terms_not_accepted"
    "setup_code_unavailable" "api.error.setup_code_unavailable"
    "register_unavailable" "api.error.register_unavailable"
    "invalid_name" "api.error.invalid_name"
    "name_taken" "api.error.name_taken"
    "name_held" "api.error.name_held"
    "domain_limit" (jsform "api.error.domain_limit" "max_domains" "int" "price_eur" "int" "contact" "text")
    "reissue_unavailable" "api.error.reissue_unavailable"
    "not_your_domain" "api.error.not_your_domain"
    "release_unavailable" "api.error.release_unavailable"
    "invalid_language" "api.error.invalid_language"}},"signin":{{jstexts
    "cancelled" "site.account.signin_error.cancelled"
    "expired" "site.account.signin_error.expired"
    "failed" "site.account.signin_error.failed"

  <script nonce="{{.Nonce}}">
  // Issue #124: the account page. Everything here talks to /api/account/*
  // with the session cookie; the shape of each answer is documented next
  // to its handler in bridge/accounts and bridge/api.
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const api = async (method, path, body) => {
    const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin', cache: 'no-store' });
    let j = {}; try { j = await r.json(); } catch (e) {}
    return { ok: r.ok, status: r.status, ...j };
  };
  let me = null, domains = [], providers = [], terms = {}, countries = {}, maxDomains = 5;

  // The page's words come from #account-text, in its language
  // (docs/i18n.md, "Rendering contract"). They, and every value put into
  // them, only ever go in as text - text nodes and textContent, never
  // markup - so nothing a translation or a value holds can become an
  // element.
  const hasOwn = Object.hasOwn || ((o, k) => Object.prototype.hasOwnProperty.call(o, k));
  const block = (id) => { try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return {}; } };
  const PAGE = block('account-page'), T = block('account-text');
  // English shows dates in the browser's own format, numbers as they come
  // and the bridge's own country names, as this page always did; the
  // other languages write them their own way.
  const ENGLISH = PAGE.lang === 'en';
  const LOCALE = ENGLISH ? undefined : PAGE.tag;
  const num = (n) => { if (ENGLISH) return String(n); try { return new Intl.NumberFormat(PAGE.tag).format(n); } catch (e) { return String(n); } };
  // Where this page is (/account, /es/account...): signing in or out comes
  // back here, in the same language.
  const SELF = location.pathname;
  // What the bridge checks or says, the same in every language: the body
  // confirming a deletion carries "delete". The word typed to confirm is
  // the page's language's (site.account.delete.word); "delete" works too.
  const MIN_PASSWORD = 8;
  const CONFIRM_WORD = 'delete';
  const CONFIRM_BODY = '{"confirm": "delete"}';
  const HOME_ADDRESS = 'http://otc.local:8080';
  const IDENTITY_FILE = '/etc/otc/otc-install.env';

  // fill puts values into a text in one pass, each as plain text: a number
  // in the page's language, a person's own words (between the isolation
  // marks the bridge put around their place) without bidi controls of
  // their own. A placeholder without a value comes out empty, and sets
  // state.missing.
  const BIDI = /[\u202a-\u202e\u2066-\u2069]/g;
  function fill(s, a, state) {
    return String(s).replace(/(\u2068?)\{([a-z][a-z0-9_]*)\}(\u2069?)/g, (m, open, k, close) => {
      const v = a && hasOwn(a, k) ? a[k] : undefined;
      if (v === undefined || v === null || v === '') { if (state) state.missing = true; return open + close; }
      const text = typeof v === 'number' ? num(v) : String(v);
      return open + (open ? text.replace(BIDI, '') : text) + close;
    });
  }
  // t(name, values): a text without spans.
  const t = (name, a) => (typeof T[name] === 'string' ? fill(T[name], a) : name);
  // rich(name, values, tags): a text with spans, as nodes: each span the
  // element tags[tag] makes of its text (b, i, code and small are those
  // elements themselves), the text between them text nodes.
  const PLAIN_TAGS = ['b', 'i', 'code', 'small'];
  function rich(name, a, tags) {
    const v = T[name];
    if (!Array.isArray(v)) return [t(name, a)];
    return v.map(([tag, s]) => {
      const text = fill(s, a);
      if (!tag) return text;
      if (tags && hasOwn(tags, tag)) return tags[tag](text);
      return PLAIN_TAGS.includes(tag) ? h(tag, {}, text) : text;
    });
  }
  // h(tag, attributes, ...children): an element. Children are nodes or
  // strings (text nodes), in nested arrays; null, undefined, false and ''
  // are left out, and so is an attribute that is null, undefined or false.
  // A ' ' child stands where the page's markup had white space between
  // two inline elements (an input and its button), as it always did.
  const kids = (c) => c.flat(9).filter((x) => x !== null && x !== undefined && x !== false && x !== '');
  function h(tag, at, ...c) {
    const e = document.createElement(tag);
    for (const k in at || {}) {
      const v = at[k];
      if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? '' : String(v));
    }
    e.append(...kids(c));
    return e;
  }
  const paint = (...c) => $('#view').replaceChildren(...kids(c));

  // Error messages come from the #error-text table by code. An API answer
  // with a code the table lacks shows the server's own text, then the
  // caller's fallback; a sign-in's ?error= is only ever looked up, never
  // shown as it is, so a crafted link can't make this page say anything.
  const errorTable = block('error-text');
  const lookUp = (table, code) => (typeof code === 'string' && table && typeof table === 'object' && hasOwn(table, code)) ? String(table[code]) : '';
  // fillIn puts the terms' figures into a message; one it can't fill
  // (the terms not loaded) gives '' so the server's text is shown instead.
  function fillIn(text) {
    const vars = { min_chars: MIN_PASSWORD, max_domains: terms.max_domains, price_eur: terms.extra_domain_eur, contact: terms.contact, body: CONFIRM_BODY };
    const state = { missing: false };
    const out = fill(text, vars, state);
    return state.missing ? '' : out;
  }
  const errText = (r, fallback) => fillIn(lookUp(errorTable.api, r.code)) || r.error || fallback;
  // An unknown sign-in code gets the general "could not be completed".
  const signInErrorText = (code) => lookUp(errorTable.signin, code) || lookUp(errorTable.signin, 'failed');

  // The links in the terms' texts, which open in a new tab.
  const newTab = (href) => (s) => h('a', { href, target: '_blank' }, s);
  const termsLinks = { terms: newTab('/terms'), privacy: newTab('/privacy') };
  const termsBox = () => h('div', { class: 'terms' },
    rich('termsIntro', { max_domains: terms.max_domains, host: location.hostname }),
    h('br'), h('br'),
    rich('termsPricing', { max_domains: terms.max_domains, free_years: terms.free_years, price: terms.price_per_year_eur, extra_domain_eur: terms.extra_domain_eur, contact: terms.contact, inactive_months: terms.inactive_months },
      { ...termsLinks, mail: (s) => h('a', { href: 'mailto:' + (terms.contact ?? '') }, s) }));
  const termsCheck = (id) => h('label', { class: 'check' }, h('input', { type: 'checkbox', id }), ' ', h('span', {}, rich('termsAccept', null, termsLinks)));
  const providerButtons = (ret) => providers.length ? h('div', { class: 'providers' }, providers.map((p) => h('a', { href: '/account/auth/' + p + '/start' + (ret ? '?return=' + encodeURIComponent(ret) : '') }, t('continueWith', { provider: p === 'google' ? 'Google' : 'Apple' })))) : null;
