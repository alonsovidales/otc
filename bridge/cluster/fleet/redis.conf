# otc-fleet-agent on redis: Redis + certificate renewal (certbot.timer).
# The certificate's days left are reported by each bridge node for the
# copy it serves; add "-cert <file>" here for a readable copy on this host.
[Service]
Environment="OTC_FLEET_ARGS=-name redis -roles redis,certbot -redis 10.10.0.1:6379 -redis-user otc-fleet"
