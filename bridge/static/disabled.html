<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Account disabled</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #16181c;
        color: #e7e9ec;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        max-width: 420px;
        margin: 24px;
        padding: 32px;
        border: 1px solid #2a2d33;
        border-radius: 12px;
        background: #1c1f24;
        text-align: center;
      }
      h1 { margin: 0 0 8px; font-size: 1.25rem; }
      p { margin: 0; color: #9aa0a8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>This account has been disabled</h1>
      <p>The owner of this device has disabled this account. Contact them if you believe this is a mistake.</p>
    </div>
  </body>
</html>
