<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Device not available</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #16181c;
        color: #e7e9ec;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        max-width: 420px;
        margin: 24px;
        padding: 32px;
        border: 1px solid #2a2d33;
        border-radius: 12px;
        background: #1c1f24;
        text-align: center;
      }
      /* Issue #56 asks for an icon making "not reachable" readable at a
         glance - an unplugged cloud, drawn inline so this page never
         depends on fetching anything from the device that is, by
         definition, the thing that isn't answering. */
      .icon { display: block; margin: 0 auto 16px; color: #e8845f; }
      h1 { margin: 0 0 8px; font-size: 1.25rem; }
      p { margin: 0; color: #9aa0a8; line-height: 1.5; }
      .retry { margin-top: 20px; }
      button {
        font: inherit;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid #3a3d44;
        background: #262a30;
        color: #e7e9ec;
        cursor: pointer;
      }
      button:hover { background: #2f343b; }
      .countdown { margin-top: 10px; font-size: 0.85rem; color: #6f757d; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="icon" width="56" height="56" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M17.5 18H7a4.5 4.5 0 0 1-.6-8.96 5.5 5.5 0 0 1 10.53 1.48A3.75 3.75 0 0 1 17.5 18Z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <h1>This device isn't available right now</h1>
      <p>
        It looks like it's switched off, offline, or still starting up. Nothing has been
        lost — everything stays on the device itself. Try again in a moment.
      </p>
      <div class="retry">
        <button type="button" id="retry">Try again</button>
        <div class="countdown" id="countdown"></div>
      </div>
    </div>
    <script>
      // Checking back on its own matters more here than on most error
      // pages: a device that's simply rebooting (a `make pi` deploy, a
      // power blip) comes back within a minute, and whoever hit this
      // shouldn't have to sit there refreshing to find out.
      var seconds = 30;
      var countdown = document.getElementById('countdown');
      var retry = document.getElementById('retry');
      retry.addEventListener('click', function () { location.reload(); });
      setInterval(function () {
        seconds -= 1;
        if (seconds <= 0) { location.reload(); return; }
        countdown.textContent = 'Checking again in ' + seconds + 's';
      }, 1000);
      countdown.textContent = 'Checking again in ' + seconds + 's';
    </script>
  </body>
</html>
